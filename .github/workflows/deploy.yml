name: 部署到 Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # wrangler 鎖 4.120.0 的理由見 .agent/PITFALLS.md
      # --branch master 不可省，帶錯會安靜地落在 Preview
      - run: npx wrangler@4.120.0 pages deploy dist --project-name personal-site --branch master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7f497e73bed26bf77b22ccadf665f550
