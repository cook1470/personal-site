gns normal; wakes by herself around four in the morning.`,ifDispatched:`Rousable on scene, vital signs normal, family sign refusal.`,ifIgnored:`Wakes by herself.`},b05:{location:`Pinbank Street, 21, second floor`,lines:[`My head. I've been sick with it.`,`It come on about half eleven and it's got worse since.`,`Once. Just the once.`,`It's all this side, over my eye.`,`I can't have the light on, I've had to do this in the dark.`,`I've had them before but not like this one.`,`My husband would run me up but he's had a drink.`,`I've a tablet for them in the drawer, I'll try one in a bit.`],truth:`Thirty-four year old woman. Migraine with photophobia and vomiting, same history before. Neurological examination and imaging normal.`,ifDispatched:`Analgesia in the department, imaging normal, discharged.`,ifIgnored:`Sleeps after painkillers, eases by the afternoon.`},b06:{location:`Washpit Lane, the end of the lane`,lines:[`There's a fella laid at the end of the lane here.`,`By the boxes, where they stack them.`,`I'm past here every night. He's usually further in than that.`,`I've said to him and he's not moved.`,`He's got a coat over him.`,`I've another drop to do, I'm due back at five.`],truth:`Male, rough sleeper, asleep. Temperature and consciousness normal.`,ifDispatched:`Roused on scene, refuses hospital.`,ifIgnored:`Moves off at first light.`},b08:{location:`Sugarhouse Road, 5`,lines:[`My stomach's blown up, it's been like it days.`,`I've not been. Four days. Five, it could be.`,`I got some of that liquid off the chemist, I've had two lots.`,`It comes in waves, low down this side.`,`I'm not being funny but I don't want them putting a camera in me.`,`I've eaten nothing since dinner time yesterday.`,`I'll have another go in a bit.`],truth:`Sixty year old man. Faecal impaction, no features of bowel obstruction.`,ifDispatched:`Enema in the department, improves.`,ifIgnored:`Passes it himself in the early morning.`},b09:{location:`Harrow Bank, 3`,lines:[`My mate's not right.`,`He's sweating and he says his heart's going.`,`We're at a lad's house.`,`Don't send police. There's no need for police.`,`He's had a drink. What else he's had I couldn't tell you.`,`He keeps getting up and sitting back down.`],truth:`Nineteen year old man. Tachycardia and anxiety after a central nervous system stimulant. Vital signs settle within three hours.`,ifDispatched:`Heart rate one hundred and eight on scene, alert, refuses transport.`,ifIgnored:`Settles by early morning.`},b10:{location:`Ashwell Street, 33`,lines:[`My dad's mouth has gone over to one side.`,`Just now. We were sat watching telly.`,`His words went funny, that's what made me look at him.`,`My mum reckons it's the cold got into it, she keeps putting a warm towel on him.`,`He says there's nothing up with him, he wants to go to bed.`,`His eye's not right either, that side.`,`My mum's crying, I can't get any sense out of her.`],truth:`Sixty year old man. Right-sided peripheral facial nerve palsy.`,ifDispatched:`Assessed in the department, steroids, clinic follow-up.`,ifIgnored:`Goes himself in the morning, largely recovers over some weeks.`},c01:{location:`Fenwick Road, flat 12`,lines:[`Sorry — is that the ambulance? It's not an emergency, I don't want to be — he's a bit puffed, that's all. He's sat down now.`,`He did the shed all afternoon so it'll be his back off that.`,`He's saying don't.`,`Do you charge for it, or. Because we'd sooner wait and see the doctor Tuesday.`,`He wants to know how long. If it's long he'd rather not.`],truth:`Aortic dissection. The tearing pain has moved down from between the shoulder blades. Blood pressure falling.`,ifDispatched:`Straight to theatre. Survives.`,ifIgnored:`Forty minutes later someone else in the flat calls. No pulse.`},c02:{location:`car park off Marlow Road`,lines:[`He can't breathe. My mate can't breathe.`,`No — he's saying it. He's saying I can't breathe, I can't breathe.`,`How long. How long.`,`His hands have gone. Look at his hands, mate, look at them.`,`He's grey. Are you listening to me. He's grey.`,`Say something.`],truth:`Twenty-six year old man, panic attack, hyperventilating.`,ifDispatched:`By arrival he is calm. Refuses transport, signs. One vehicle gone forty minutes.`,ifIgnored:`Settles on its own in about twenty minutes.`},c03:{location:`Sedgely Road, 88`,lines:[`Female, seventy-two. Unresponsive. No radial pulse.`,`I've put her on her side. Nothing in the airway.`,`History of hypertension, AF, she's had her morning meds.`,`Eighty-eight Sedgely Road, the side gate's open, don't bother with the front.`,`I'll wait by her.`,`There's a dog in the kitchen but he's shut in.`],truth:`The caller is a nurse. She is also the daughter. The mother has no respiratory effort.`,ifDispatched:`CPR, return of circulation, severe hypoxic injury.`,ifIgnored:`Found by a neighbour the following day.`},c04:{location:`somewhere off Halloway Street (no number)`,lines:[`Hello?`,`My mum's on the floor.`,`She went all shaky and then she stopped doing it.`,`I don't know.`,`It's the one after the shop.`,`There's a green bin.`,`Her eyes are open but she's not looking.`,`Is my mum's fine.`],truth:`Post-seizure. The mother has not regained consciousness. The child is seven.`,ifDispatched:`Slow to locate. Hospital. No lasting damage.`,ifIgnored:`She vomits during the postictal period and aspirates. Severe pneumonia.`},c05:{location:`Kestrel Street`,lines:[`Hello? You'll have to speak up, love.`,`I said I've come over not right.`,`What?`,`On my own, yes. Since March.`,`It's been since this morning. I thought I'd have a lie down and it'd go.`,`I keep dropping things. The cup went.`,`I can't hear a word you're saying.`],truth:`Eighty-one year old man. Left-sided weakness. Ischaemic stroke, now past eight hours.`,ifDispatched:`Too late for thrombolysis. Rehab still possible.`,ifIgnored:`Found by a neighbour the next day. Every window missed.`},c06:{location:`Ardley Street, shop doorway`,lines:[`He's gone down.`,`He's fine, he's fine, he does this.`,`Get up — he's laughing, look, he's laughing.`,`We've had, like, two. Three.`,`He's snoring his head off. Honest to God, you can hear him from here.`,`No, you're alright, don't worry about it. Cheers, bye.`],truth:`Straightforwardly drunk. Loud snoring means the airway is open.`,ifDispatched:`Awake, refuses, argues with the crew.`,ifIgnored:`Walks off before dawn.`},c07:{location:`under Dunnock Bridge, building site`,lines:[`Sir. My friend. He come from up there, down.`,`My English is not good. Sorry.`,`He speak before. Before he speak. Now no.`,`The leg — here — is not the right way.`,`No light here. Is dark.`,`Under the bridge. The building.`,`Please you come.`],truth:`Four-metre fall. Pelvic fracture with internal bleeding. Was conscious, now isn't.`,ifDispatched:`Hospital. Long rehabilitation.`,ifIgnored:`Dies of haemorrhagic shock.`},c08:{location:`Cranmer Street, 5`,lines:[`My wife's had a fall.`,`Bathroom. She's slipped, she's always doing it.`,`There's a bit of blood, her face here.`,`She's alright, she's having a sit down.`,`No, don't put her on, I'll tell you, it's easier. She's not making much sense.`,`When you come don't buzz, I'll be at the door for you.`],truth:`Domestic assault. Fractured zygoma, perforated eardrum. The caller did it.`,ifDispatched:`Hospital plus safeguarding referral. Risk of confrontation on scene.`,ifIgnored:`She re-enters the system in a fortnight.`},c09:{location:`Crowmarsh Close`,lines:[`It's my back. It's been my back three months, it's nothing new.`,`No, I know. I know it's not that.`,`I'm out the door half six.`,`If I go up there on my own now, what am I looking at. Four hours? Five.`,`Bloke at work says they take you through quicker if you come in with you lot.`,`I've had three months of it, I've just got to be in tomorrow.`],truth:`Chronic low back pain. No red flags. He wants to skip triage.`,ifDispatched:`An hour gone. Other calls in that window wait.`,ifIgnored:`Makes his own way in.`},c10:{location:`Yarrow Hill (signal breaking)`,lines:[`—hello— there's a car—`,`It's gone, it's gone over—`,`Can you hear—`,`Two of them, one's — one's out—`,`the signal's—`,`"—the bend, third—" (cuts out)`],truth:`Single vehicle, rolled. Driver ejected, passenger trapped. Both critical.`,ifDispatched:`Requires a search of the road. Both live.`,ifIgnored:`Found at first light. Both dead.`},c11:{location:`(no address)`,lines:[`Yeah, large doner, chilli sauce, and chips.`,`You've got the address on there, haven't you.`,`…Sorry, what?`,`Is that not the kebab shop?`,`"Oh God. Sorry. Sorry, love." (hangs up)`],truth:`A wrong number.`,ifDispatched:null,ifIgnored:null},c12:{location:`Pinfold Road, junction`,lines:[`There's a bloke laid in the road here.`,`I'm not going right up to him.`,`Motorbike's on its side next to him.`,`He moved. He did move, before.`,`There's a good few people round him now.`,`I'll leave it with you, I'm meant to be somewhere.`],truth:`Bike versus car. Head injury. Extradural haematoma developing.`,ifDispatched:`Surgery. Good recovery.`,ifIgnored:`Deteriorates within the hour. Permanent disability.`},c12r:{location:`Pinfold Road, junction`,lines:[],truth:``,ifDispatched:null,ifIgnored:null},c14:{location:`Fenwick Road, 40`,lines:[`My little boy's gone into the corner of the table.`,`There's blood everywhere, his top's ruined, it's all down him.`,`He won't stop crying. He won't stop.`,`His head, here, it's split, you can see it's split.`,`I've got a towel on it and it's still coming through.`,`Please can you be quick.`],truth:`Three-centimetre scalp laceration. Scalps bleed hard. The volume looks far worse than the loss.`,ifDispatched:`Five stitches.`,ifIgnored:`Taken in by car. Five stitches.`},c15:{location:`Marlow Road, 3`,lines:[`I think my daughter's swallowed something, I'm probably being daft.`,`A little one. Round. Off the back of something, I don't know what off.`,`She coughed twice and that was it, she's playing now, she's fine.`,`I only rang to ask really. She's had her milk and everything.`,`Do we need to go, or. Because she's due bed.`],truth:`Button battery, lodged in the oesophagus. Begins burning through the mucosa inside six hours.`,ifDispatched:`Removed endoscopically. No sequelae.`,ifIgnored:`Perforated oesophagus the next day.`},c16:{location:`Halloway Street, 19`,lines:[`Hello love, I'm ever so sorry to bother you this late.`,`It's nothing really. I've just come over a bit off.`,`It's here. Like a heaviness. Not a pain as such.`,`A bit sicky with it.`,`I've gone through two nighties, I've been that clammy.`,`I'll sit and it'll pass. It's our Susan making me ring, she's on at me.`],truth:`Seventy year old woman. Inferior myocardial infarction, atypical presentation.`,ifDispatched:`Catheter lab. Survives.`,ifIgnored:`Ventricular fibrillation in about two hours.`},c17:{location:`Ardley Street, 22`,lines:[`There's blood everywhere. There's blood everywhere.`,`The sink. The whole sink.`,`Ten minutes. It's been ten minutes.`,`I've gone — my head's gone.`,`I'm going down. I'm going down, mate, come on.`],truth:`Nosebleed. About thirty millilitres lost. The dizziness is hyperventilation.`,ifDispatched:`They show him how to pinch the soft part of his nose and leave.`,ifIgnored:`Bleeding stops after fifteen minutes of pressure.`},c18:{location:`Sedgely Road, 5`,lines:[`It's me again, from before.`,`Yeah. Car park. That one.`,`He's still not right, he's saying his heart's doing something.`,`I know. I know what you said before, I do.`,`But it's different this time.`,`He's saying it an' all, he says it's not the same as it was.`],truth:`The panic attack has tipped into SVT. Rate 210.`,ifDispatched:`Chemical cardioversion. Fine.`,ifIgnored:`Syncope, head strike. Survives, delayed.`},c19:{location:`Crowmarsh Close, 8`,lines:[`We've all got the headache, all of us.`,`Kids have gone floppy, they just want bed.`,`There's something going round, half the street's had it.`,`He's on the sofa, I can't really get him up, but he's had a long one.`,`Windows? No, it's freezing.`,`I'll see how he is in the morning.`],truth:`Carbon monoxide from the boiler. Four people in the house.`,ifDispatched:`Hyperbaric oxygen. All four live.`,ifIgnored:`Two die.`},c20:{location:`the water east of Dunnock Bridge`,lines:[`There's somebody in the water.`,`I don't know how long. I've only just seen it.`,`There's something floating and it's not moved.`,`I can't get down, it's all rocks this side.`,`I shouted him and he didn't do anything.`,`About — ten metres out. Ten, twelve.`],truth:`Roughly forty minutes submerged. Water is not cold enough for protective hypothermia. Not recoverable.`,ifDispatched:`Recovery. Pronounced at scene. Speed changes nothing.`,ifIgnored:`Recovery. Pronounced at scene. Speed changes nothing.`},c20r:{location:`the water east of Dunnock Bridge`,lines:[],truth:``,ifDispatched:`Recovery. Pronounced at scene. Speed changes nothing.`,ifIgnored:`Recovery. Pronounced at scene. Speed changes nothing.`},c21:{location:`Kestrel Street, 14`,lines:[`Can I ask something on this number, or have I to ring somewhere else.`,`My mum come home Tuesday. She had the op.`,`I've just done her dressing and there's yellow on it.`,`She's not in pain with it. She's asleep.`,`I washed my hands. I did wash them.`,`I'm not after an ambulance. I don't know who I'm meant to ask.`,`I'll take her up in the morning.`],truth:`Superficial post-operative wound discharge. A district nurse job. Not an emergency.`,ifDispatched:`Nothing to convey. A wasted run.`,ifIgnored:`Dressed at the surgery. Heals normally.`},c22:{location:`Cranmer Street, 33, flat 5`,lines:[`She's had it.`,`In the bathroom, I couldn't hold her up.`,`Yeah — there's a noise, it's crying.`,`The cord's still on.`,`I'm not touching it, I daren't.`,`The floor's all slippy.`,`There's nobody else here.`],truth:`Delivery outside hospital. Mother and baby currently stable. Needs warmth and cord management.`,ifDispatched:`Both well.`,ifIgnored:`Neonatal hypothermia. Retained placenta, maternal haemorrhage.`},c23:{location:`Pinfold Road, 7`,lines:[`He's been stung.`,`Arm, here. It's come up red.`,`He says his throat's a bit tight.`,`He'll be alright, he's been stung before, he was fine that time.`,`He's sat down out the way.`,`"Voice has gone a bit croaky, that's all." (background: breathing in)`],truth:`Anaphylaxis. Laryngeal oedema, progressing.`,ifDispatched:`Adrenaline. Full recovery.`,ifIgnored:`Complete airway obstruction inside fifteen minutes.`},c24:{location:`Yarrow Hill, 6`,lines:[`Hello.`,`…`,`You there.`,`…`,`(a chair moving)`,`(a long stretch of breathing)`,`No, you're alright.`,`(line stays open, four minutes of background)`],truth:`Man living alone. Took an overdose, then changed his mind. No longer has the strength to speak.`,ifDispatched:`Gastric lavage. Survives. Enters follow-up care.`,ifIgnored:`Dies before dawn.`},c25:{location:`Fenwick Road, flat 12`,lines:[`It's me, I rang before, about half eleven. Sorry.`,`You can take us off, whatever it is you do.`,`He's gone off. He's been off since about two, hasn't stirred.`,`No, that's stopped. He's not doing the breathing any more.`,`He's a funny colour but he's always a bit like that when he's tired.`,`I'll do him a tea in the morning. Sorry for messing you about.`],truth:`The dissection has reached the coronary ostia. He is unconscious from low perfusion.`,ifDispatched:`Thoracotomy in resus. Around fifty per cent.`,ifIgnored:`Dies.`},c26:{location:`Corve Street, 8`,lines:[`My boy's been coughing since about ten.`,`Sat himself up in bed with it. Woke himself up.`,`It's a funny cough, it's like a dog. That's the only way I can put it.`,`He's stopped now though. He's gone all quiet, bless him.`,`Shall I leave him and see how he goes? I've got him a drink in there.`,`He won't lie down. He's just sat up on the pillows.`],truth:`Four year old. Acute epiglottitis. The upright posture is airway maintenance.`,ifDispatched:`Intubated. A week in hospital. Lives.`,ifIgnored:`Complete obstruction within forty minutes.`},c27:{location:`Kiln Lane, 41, rear`,lines:[`(breath) I.`,`(breath) Can't.`,`(breath) Talk.`,`Hang on.`,`(long breath) Can't lie.`,`Kiln Lane.`,`Forty… (breath) one.`,`(breath) Round the back.`],truth:`Sixty year old man. Acute pulmonary oedema. Orthopnoeic, cannot finish a sentence.`,ifDispatched:`Responds to treatment. Admitted.`,ifIgnored:`Respiratory failure within two hours.`},c28:{location:`Corve Street, 20, outside`,lines:[`(laughing behind him) Hang on — no. It's my ankle.`,`I come off that step. The one by the door.`,`I can stand on it. Look. Look, I can stand on it.`,`(a thud)`,`He can't drive me, he's had a drink an' all.`,`Only a couple.`,`It's swelled up though.`],truth:`Ankle sprain. No fracture signs.`,ifDispatched:`Bandaged, refuses transport. Twenty minutes gone.`,ifIgnored:`Another mate comes out for him. Ice and a bandage.`},c29:{location:`Bracken Lane, the far end`,lines:[`My dad's come off the ladder.`,`He's up, he's walked himself back in, he's in the kitchen now.`,`He's talking, he's talking normal, he's had a right go at me for ringing.`,`He says his neck's gone a bit — funny. Numb-ish. Down the back.`,`We're a fair way out, do you know the lane? It's past the farm.`,`He's saying don't.`],truth:`Seventy year old man. Cervical fracture. The cord is not yet fully injured.`,ifDispatched:`Immobilised, surgery, function preserved.`,ifIgnored:`Quadriplegic by morning.`},c30:{location:`Kiln Lane, 9`,lines:[`Could somebody just come out. Just come and have a look.`,`My mum's in there.`,`She's answered me. She answered me before.`,`The door's locked and she's saying don't come in.`,`I don't know what I'm meant to be telling you.`,`I'm sorry, I know it's — could somebody just come.`],truth:`Upper GI haemorrhage. The daughter has heard retching and swallowing through the door. Her mother can no longer get to the lock.`,ifDispatched:`Door forced, transfused, survives.`,ifIgnored:`Door forced at first light. Dead.`},c31:{location:`(unknown)`,lines:[`Hiya, that—`,`(wind)`,`there's a—`,`(cuts out)`],truth:`A rider has pulled up by the flyover to report a single-vehicle crash ahead of him. It is a dead spot. He does not get through again.`,ifDispatched:`No address. A search along the road. One vehicle held for forty minutes, and it may find him.`,ifIgnored:`Found by a passing car an hour later. Dead.`},c32:{location:`Ashwell Street, 5`,lines:[`Help — she's bleeding — it's all over the floor—`,`(someone else: sit down, sit down)`,`I don't know where it's coming from, there's loads of it, there's loads—`,`She's gone white, she can't get her words out—`,`Please, will you hurry up, please—`,`She's saying the room's going—`],truth:`Thirty-four year old woman. Ruptured ectopic pregnancy. What is on the floor is a fraction of what is in her abdomen.`,ifDispatched:`Emergency surgery. Survives.`,ifIgnored:`Haemorrhagic shock within the hour. Dies.`},c32r:{location:`Ashwell Street, 5`,lines:[],truth:``,ifDispatched:null,ifIgnored:null},c34:{location:`Bracken Lane, 12`,lines:[`My husband's saying his chest is tight.`,`He's in the front room.`,`We're right down the end, you follow it to the bottom and then it's left, there's no sign or anything.`,`He says it's indigestion, he's had a Rennie. He didn't want me ringing.`,`I've rung anyway.`,`He says it's easing off now, actually.`],truth:`Fifty-eight year old man. Acute MI. The easing is partial reperfusion of the thrombus.`,ifDispatched:`Sixty minutes round trip. Vessel opened. Lives.`,ifIgnored:`Ventricular fibrillation around two.`},c35:{location:`Corve Street, 33, flat 4`,lines:[`I'm alright, it's not — my watch has come up with a warning thing.`,`One-ninety, it said. That was a couple of minutes back.`,`I've been on the treadmill. I'm on nights, so this is like my morning.`,`Hang on, I'll — right. One-seventy-two now.`,`I tried ringing my mum first, she has her phone off at night.`,`I've done a blood pressure as well, one-forty something.`],truth:`Twenty-six year old man. Post-exertional sinus tachycardia. Down within minutes.`,ifDispatched:`Rate eighty-two on arrival. Refuses transport.`,ifIgnored:`Normal in ten minutes.`},c36:{location:`Kiln Lane, 27`,lines:[`My mum's talking a bit — funny.`,`She's trying to say something and it won't come, she keeps pointing at the fridge.`,`I ask her what she wants and she gets cross with me.`,`She's saying she's fine. She can walk, look — she can walk, she's just been to the toilet on her own.`,`It started about twenty past, twenty-five past.`,`Or do we ring the doctor in the morning?`],truth:`Seventy-five year old woman. Left MCA stroke, expressive aphasia. The window is still open.`,ifDispatched:`Thrombolysis. Most of her language comes back.`,ifIgnored:`Window missed. Permanent aphasia.`},c37:{location:`Ashwell Street, 18`,lines:[`I've been sick since eleven.`,`My mate had the same as me. He's alright, he's not been sick at all.`,`I've been sat on the floor and my legs have gone dead.`,`(retching) ...hang on.`,`There's nothing left. It's just water.`,`I did think about getting a taxi. I don't want to be sick in somebody's car.`,`I don't know if this is the sort of thing or not.`],truth:`Acute gastroenteritis. Mild dehydration.`,ifDispatched:`Same treatment. Fifty minutes of a vehicle.`,ifIgnored:`Takes himself in at dawn. Fluids. Better.`},c38:{location:`Corve Street, 51, flat 2`,lines:[`(slurred) …I can't get up.`,`(a bang) Hang on.`,`I've fell over.`,`What time is it?`,`Who's this?`,`I've not had a drink.`,`"I'm going to bed."(hangs up)`],truth:`Sixty-eight year old man. Diabetic hypoglycaemia. Nothing to do with alcohol. Level of consciousness still falling.`,ifDispatched:`IV glucose. Awake in ten minutes.`,ifIgnored:`Irreversible brain injury by morning.`},c39:{location:`Bracken Lane, the top track`,lines:[`Sorry, this is going to sound daft. My mate's up on the hill and he's texted me.`,`He says he's done his ankle and he can't walk on it.`,`He's on his own up there.`,`The message come through forty minutes ago and I've heard nothing since, I've rung him twice.`,`He says second fork going up. That's all it says.`,`I'm not there, I'm two hundred mile away.`],truth:`Open ankle fracture on the hill. Hypothermia setting in.`,ifDispatched:`A search of the track. One vehicle gone over two hours. He lives.`,ifIgnored:`Moderately hypothermic by first light. Found by walkers.`},c40:{location:`Kiln Lane, 55`,lines:[`I need an ambulance.`,`Not me. My husband.`,`He's on the floor and he's going stiff, he's — his arms.`,`What colour? Dark. I can't tell you if it's blue, it's dark.`,`He's not breathing. He's not — he isn't.`,`Tell me. Tell me what to do.`],truth:`Fifty-two year old man, witnessed cardiac arrest, still shockable.`,ifDispatched:`Shocked, return of circulation, discharged home.`,ifIgnored:`Dies.`},c41:{location:`Ashwell Street, 40`,lines:[`I went to get up off the settee and it's gone again.`,`It's me back. It's an old thing, I've had it years.`,`I've not fell. I sat back down, that's all I did.`,`I've been sat here since twelve waiting for it to ease off. It's not easing.`,`Fourth floor and there's no lift in this block.`,`Me tablets are in the bathroom.`],truth:`Acute flare of chronic degenerative back pain. No neurological red flags.`,ifDispatched:`Carried down four flights, analgesia in A&E. An hour gone.`,ifIgnored:`A neighbour helps him in after seven.`},c42:{location:`Threshers Lane, at the Clay Pit Road junction`,lines:[`There's two — no, there's another one in front of them.`,`I've been hit as well, I'm alright.`,`The front one's gone over. It's on its side across the middle.`,`Somebody's shouting. There's one that keeps shouting.`,`The others aren't making any noise.`,`I don't know how many. I'm not going up to it.`],truth:`Four-vehicle pile-up. Two trapped in the rolled car (driver, shattered pelvis; woman in the rear, head injury), one man pinned by the legs in the second car and fully conscious, and a pregnant woman in the third with abdominal impact. Five casualties, three of them time-critical. All three vehicles can remove three people at most, and extrication takes time.`,ifDispatched:`No allocation covers everyone.`,ifIgnored:`Both trapped occupants die. The unborn child dies.`},c43:{location:`Threshers Lane, 61`,lines:[`It's all piled up outside my house.`,`Have I? No, I've not, I was looking for my phone.`,`There's one that's got himself out. He's sat down on the road.`,`I've told him it's in hand.`,`His leg's bleeding but he got up on his own, he was walking about.`,`There's another one further down and I can't see in it.`],truth:`Same collision. The man who got himself out is the driver of the rolled car with a pelvic fracture; standing and walking is making the internal bleeding worse. The woman in the back of his car is his wife. The one he cannot see into is the pregnant woman.`,ifDispatched:`If he is treated first, either the pregnant woman or the woman in the back does not get there in time.`,ifIgnored:`The driver bleeds into shock.`},c44:{location:`Threshers Lane, at the junction (second line)`,lines:[`Sorry — it's my stomach. It's my stomach.`,`I was driving.`,`I'm alright. My husband's next to me, he's gone out, he's not come round yet.`,`Go to him first.`,`It's gone hard, here. It goes hard and then it goes off again.`,`Thirty-four weeks.`,`There's no blood, I've had a look, there's no blood.`,`Go to him first, please.`],truth:`Placental abruption. Her husband has had a brief loss of consciousness.`,ifDispatched:`Both survive.`,ifIgnored:`The baby dies. She haemorrhages.`},c45:{location:`Sowerby Street, 7`,lines:[`My husband said something a bit odd in the front room just now.`,`He said sorry, and then he went in the bedroom.`,`He's locked it.`,`He's not had a drink.`,`I've knocked and he's not answering.`,`He lost his job last month.`,`Am I reading too much into it?`],truth:`He has taken a large quantity of prescription medication behind the door. The window is around forty minutes.`,ifDispatched:`Door forced, lavage, survives.`,ifIgnored:`Found after first light. Dead.`},c46:{location:`Nettlefold Street, 40`,lines:[`They're at it again.`,`Upstairs. Not me, upstairs.`,`It's loud, it's banging about, it's been going on a while.`,`Something come down, I heard it come down.`,`I don't want them knowing it was me that rang.`,`It's stopped now.`,`You'll see when you get here.`,`I'm going to go.`],truth:`The woman upstairs has been pushed into a table. Ruptured spleen.`,ifDispatched:`Splenectomy. Survives.`,ifIgnored:`Bleeds to death in about two hours.`},c47:{location:`Embankment Row, 12`,lines:[`My mate's gone over and banged his head.`,`He's had a bit, yeah. Not much.`,`Two. He's had two.`,`He's sat there on his phone now, he's right as rain.`,`I think he's fine, it's his girlfriend going on at me to ring.`,`You can come if you want, like.`],truth:`He has drunk a great deal more than reported. Fall with acute-on-chronic subdural haemorrhage. The lucid interval is now.`,ifDispatched:`CT shows the bleed. Surgery.`,ifIgnored:`Cannot be roused four hours later. Permanent disability.`},c48:{location:`Clay Pit Road, 88`,lines:[`I've hit somebody.`,`It wasn't my fault, he come straight out.`,`He's laid over there.`,`I got out and had a look, he's breathing.`,`Do you have to tell the police?`,`My car's here at the side.`,`He's quite old.`],truth:`Elderly man. Multiple rib fractures with a haemothorax. The caller has been drinking and is stalling.`,ifDispatched:`Chest drain. Survives.`,ifIgnored:`Tension pneumothorax. Dies.`},c49:{location:`Aldgrove Street, 22, ground floor`,lines:[`Thirty-eight.`,`Thirty-eight point two that time. Before that it was thirty-eight.`,`He's had the medicine. Eight o'clock. Or nine.`,`He keeps crying. I've been holding him and my arm's gone.`,`I spilt half of it pouring it. I don't know how much of it went in him.`,`My husband's on nights. I've not got a car.`,`(a child crying) ...hang on a minute.`],truth:`Viral fever. No red flags. A mother on her own, no transport.`,ifDispatched:`A GP-level job. Forty minutes gone.`,ifIgnored:`She takes him in after seven. Fine.`},c50:{location:`Cranmer Street, 5`,lines:[`I'm from next door.`,`That house — the one where the fella rang you before.`,`She's on the stairs, she's in the stairwell.`,`She can't talk, so I've rung.`,`She keeps shaking her head at me not to.`,`There's something running out of her ear.`,`He's in the house.`],truth:`Basal skull fracture with CSF otorrhoea.`,ifDispatched:`Hospital plus safeguarding. Confrontation on scene.`,ifIgnored:`Intracranial infection. Dies.`},c51:{location:`Pinfold Road, 7`,lines:[`Hiya, sorry — I rang before, about the sting.`,`He's a lot better, you don't need to come.`,`He's just sat having a rest.`,`His voice? He always sounds like that.`,`He's stopped going on about his throat.`,`I only rang to say don't bother, that's all.`],truth:`The laryngeal oedema has progressed to the point where he cannot report it any more.`,ifDispatched:`Just inside the window.`,ifIgnored:`Complete airway obstruction.`},c52:{location:`the market car park off Marlow Road`,lines:[`He come out this afternoon.`,`The heart rate one. You lot came out to him.`,`He says it's doing it again.`,`He's not gasping like he was, though.`,`He's saying leave it, he says don't ring.`,`I thought I'd better ask anyway.`,`He's sat in the car.`],truth:`Post-cardioversion arrhythmia, currently asymptomatic ventricular tachycardia.`,ifDispatched:`Admitted for monitoring. Survives.`,ifIgnored:`Sudden death in about forty minutes.`},c53:{location:`Sallow Bank, 14`,lines:[`I'm not wanting an ambulance.`,`There's gas. Only a bit of a smell of it.`,`I got up to the toilet and it was there on the landing.`,`I've had the window up since. I'll shut it when I go back to bed, it's perishing in here.`,`Our lad put one of them alarms in.`,`There's a tap under somewhere. I've had the torch on it.`,`It hasn't gone off, that alarm.`],truth:`A genuine small leak, at a concentration that is not dangerous with the window open. The real problem is that he is eighty, on his own, and cannot find the isolation valve.`,ifDispatched:`They turn it off for him. Nobody conveyed.`,ifIgnored:`No medical event.`},c54:{location:`the building site under Dunnock Bridge`,lines:[`I want to make complain.`,`You come here this morning.`,`My friend, you take him away, and now I don't find him.`,`His family is calling me, calling me.`,`I don't know who I ask.`,`I am very angry.`,`I don't want ambulance.`],truth:`No medical event. Limited English, no idea how to trace anybody.`,ifDispatched:`A wasted run.`,ifIgnored:`Nothing.`},c55:{location:`Nithsdale Row, 8`,lines:[`My mum keeps saying she wants to go home.`,`She is at home.`,`She says she's got to go and fetch my dad. My dad's been dead five year.`,`She started this afternoon.`,`She says her back aches.`,`She's not fallen, she's not hot.`,`Is it going off again, do you think?`],truth:`Urinary tract infection causing delirium, early sepsis. "Going off again" means the dementia.`,ifDispatched:`Antibiotics. Survives.`,ifIgnored:`Septic shock by morning.`},c56:{location:`Fivewells Terrace, 30`,lines:[`I want somebody here now. Now, tonight.`,`My mother's in there.`,`She won't come out.`,`She's saying she's not going to hospital, and she's got to go.`,`You can take her anyway, can't you. You're allowed.`,`This is the third time I've rung.`],truth:`Eighty year old woman, terminal, at home, awake, competent, and clear that she is not going. The son cannot accept it.`,ifDispatched:`She cannot be taken against her will. An hour of standing in a hallway.`,ifIgnored:`No change.`},c57:{location:`Threshers Lane, 61`,lines:[`Hello. Sorry.`,`I wanted to ask about earlier, out here.`,`They've had the road clear a good while now.`,`It's just — the one that was shouting.`,`Did he come out of it?`,`It's alright. I only wondered.`,`Sorry to ring this early.`,`You've had a night of it.`],truth:`No new incident. Nobody is hurt.`,ifDispatched:`There is nowhere to send it.`,ifIgnored:`Nothing.`},c58:{location:`Alder Brook Street, 6, ground floor`,lines:[`It's Nan — the thing. The tube.`,`Her neck. Here.`,`I don't know the word. I'm sorry.`,`I push it, it won't go back.`,`She's breathing. Yes. Small.`,`Her face is — different now.`,`I'm on my own. Her husband — no, her son — he's not back.`,`What do I do.`],truth:`Eighty-four year old woman, tracheostomy tube fully displaced about ten minutes ago. The stoma is closing. Ventilation is inadequate. The carer has been in post three weeks.`,ifDispatched:`Retubed, conveyed, survives.`,ifIgnored:`The stoma closes. Hypoxic arrest.`},c59:{location:`Washpit Lane, 21`,lines:[`My — my — my flat's got a s— a smell.`,`No. Not that.`,`Hang on.`,`G— g— g—`,`(breath) I've smelt it a long time.`,`Do I — do I put the light on.`,`Washpit. Two— twen—`,`Wait. Wait, I can't get it out.`],truth:`Bottled gas, loose hose connection, building up in a bedsit for around forty minutes. The caller has a stammer. He already has a headache and nausea.`,ifDispatched:`Supply isolated, ventilated, nobody hurt.`,ifIgnored:`He puts the light on. Explosion, severe burns.`},c60:{location:`Sugarhouse Road, 14, fourth floor`,lines:[`Something's up with my son and I can't follow what he's signing.`,`He's deaf. He's been deaf since he was little.`,`He keeps pointing at his belly and then at his mouth.`,`His hands are shaking. I thought he was having a paddy with me.`,`He's breathing really hard. Big breaths, over and over.`,`I never learnt it properly. I only get bits.`,`He's not eaten since this morning.`],truth:`Sixteen year old, type 1 diabetes, ketoacidosis. Kussmaul breathing. His father's signing is limited.`,ifDispatched:`Fluids and insulin. Five days in.`,ifIgnored:`Comatose by morning. Cerebral oedema.`},c61:{location:`Backpond Street, 33`,lines:[`I wanted to ask whether this is alright, what I've been doing.`,`I've had a cold since Tuesday and I've been taking things for it.`,`The blue ones off the telly. The sachets, in the box.`,`And a white tub as well, my daughter-in-law got me that.`,`Yes, both. It doesn't touch it otherwise.`,`How many? I've not kept count.`,`I'm alright in myself really. I've just gone off my food.`],truth:`Seventy-one year old man. Two combination cold remedies containing the same drug, taken together over three days. Liver injury has begun. It will not show for another day.`,ifDispatched:`Antidote early. Full recovery.`,ifIgnored:`Fulminant hepatic failure in two days.`},c62:{location:`Pinbank Street, 9`,lines:[`(thick accent) I've been down two day.`,`Eh?`,`Down. On't floor. I said.`,`Nob'dy. I'm on me own.`,`Legs is gone.`,`(indistinct) …can't … watter …`,`Say again? You'll have to speak up.`,`Nay, it'll keep. I'll wait while it's light.`],truth:`Seventy-nine year old man on the floor for around fifty hours. Rhabdomyolysis with acute kidney injury and hyperkalaemia. The half-sentence that gets talked over is that he has not passed water.`,ifDispatched:`Emergency dialysis. Survives with partial renal recovery.`,ifIgnored:`Fatal arrhythmia before sunrise.`},c63:{location:`Harrow Bank, below the bend`,lines:[`There's somebody laid at the side of the road here.`,`I was only driving past.`,`No. I've not had a drink. Not tonight.`,`He's in the — the grass bit. Down off the side.`,`My car's pulled up a bit further on.`,`It's not me, right, I'm telling you it's not me.`,`I'll wait here.`,`You want to come down from the top, it's quicker.`],truth:`The caller has been drinking and clipped a pedestrian, who has gone about three metres down the embankment into scrub. Pelvic and chest injuries. The caller has a blunt chest injury of his own.`,ifDispatched:`A search on scene, both conveyed, the pedestrian lives.`,ifIgnored:`The pedestrian cools and keeps bleeding. Dead before dawn.`},c64:{location:`Greenhaugh Road, the back lane, 2`,lines:[`My daughter-in-law's had a fall.`,`In the living room, she's caught her foot.`,`There's a bruise coming, her stomach here.`,`My son's here with her, he's ever so worried.`,`She's sat up, she's fine, she was talking to me a minute ago.`,`You don't need to send anybody else with them, do you. Just you.`,`(background: a man's voice, indistinct)`],truth:`Ruptured spleen, bleeding into the abdomen. The son did it. His mother is in the room.`,ifDispatched:`Surgery, survives, safeguarding raised.`,ifIgnored:`Haemorrhagic shock within three hours. Dies.`},c65:{location:`Blackstone Lane, 4`,lines:[`Can I ask you something, what does it mean if you're sweating a lot.`,`No, nothing's happened, I'm fine.`,`A bit sick, and my hands have gone tingly.`,`I'm on my own here.`,`I've not had anything.`,`Tablets? No.`,`Could they just call in when they're passing? There's no rush.`,`I'm going to go, I'm getting sleepy.`],truth:`Thirty year old woman. Took a full strip of prescription sedatives about forty minutes ago.`,ifDispatched:`Lavage and monitoring. Survives, referred on.`,ifIgnored:`Respiratory depression before dawn. Dies.`},c66:{location:`behind Newfield Street, 12`,lines:[`I've cut my arm.`,`I've been doing some sheeting, the edge is sharp on it.`,`(pause) It's not deep or anything.`,`I've got a towel on it.`,`It keeps coming through.`,`If you come out — do you have to report anything?`,`I'm not being funny with you, don't read into it.`,`Forget it, I'll get myself down. Pretend I've not rung.`],truth:`Multiple self-inflicted forearm wounds, one of them into a vessel and still bleeding.`,ifDispatched:`Bleeding controlled, sutured, referred.`,ifIgnored:`Blood loss, loses consciousness, found after light.`},c67:{location:`Mill Road, the back of the warehouse`,lines:[`Come on — his leg's in it —`,`It's off, the machine's off, but we can't get him out —`,`He's talking! He's still talking, he's telling us don't pull —`,`How long? I don't know, it was like it when I come in —`,`He says it's stopped hurting —`,`Hurry up, will you — he keeps saying he wants to go to sleep —`],truth:`Lower leg trapped in a stopped mixer for around two hours. Crush syndrome. The moment the pressure comes off, the potassium will stop his heart. "Stopped hurting" is nerve and tissue death.`,ifDispatched:`Fluids and correction before release. Amputation. Survives.`,ifIgnored:`The men on site pull him out. He arrests where he lies.`},c74:{location:`Charcoal Street, the site hut by 30`,lines:[`Get somebody here — his leg —`,`He was fine this morning. I'm telling you, this morning he was fine.`,`It's black now. All of it, up to here, up to his knee.`,`When I press it, it makes a noise.`,`Don't tell me I'm making it up.`,`He's hot. He's burning, all of him.`,`He can't tell me where it hurts, he just shouts when I touch him.`,`Day before yesterday. He caught it on some wire, that's all it was.`],truth:`Fifty-two year old man. Clostridial infection following a rusty-wire injury to the forearm and lower leg. Gas gangrene with sepsis. Subcutaneous crepitus. The necrosis is moving up the leg.`,ifDispatched:`Debridement and amputation. Survives.`,ifIgnored:`Septic shock before dawn.`},c75:{location:`Heron Road, 7, third floor`,lines:[`She can't lie down.`,`(away from the phone) Lie down. Will you lie down.`,`Soon as she's flat she's not right, and then she sits up and she says she's alright again.`,`I tried to get her down and she grabbed hold of me.`,`(background: loud breathing, continuous)`,`When did it — I don't know. It woke me up.`,`She can't lie down.`,`She wants to sit. She keeps saying she wants to sit.`],truth:`Sixty-eight year old woman, acute pulmonary oedema. "Can't lie down" is orthopnoea`,ifDispatched:`Oxygen and diuretics. Four days in, home.`,ifIgnored:`Respiratory failure within two hours.`},c76:{location:`Rowan Bank, 12`,lines:[`My husband's in the toilet and the door won't open.`,`Have you got one of them bars, the metal ones?`,`I've been pulling at it, the lock's old, it won't shift.`,`There was a bang. One bang.`,`Have they got tools on the van? Have they?`,`I'm knocking and he's not answering me.`,`Tell them to bring that with them, else there's no point them coming.`,`I keep knocking.`],truth:`Sixty year old man, subarachnoid haemorrhage on the toilet, down about six minutes. Old bolt on the inside.`,ifDispatched:`Door forced, conveyed, survives with moderate disability.`,ifIgnored:`By the time a neighbour forces it he is not breathing.`},f01:{location:`Backpond Street (no number given)`,lines:[`One of the houses down Backpond Street's alight.`,`It was going when I got back, I've not long got in.`,`I can't see the number from here, the sign's in front of it.`,`It's the bottom, where the shutter is.`,`I've done the fire brigade.`,`There's a lot of smoke off it, it's all going up.`,`My van's under it, I'm going to shift it.`],truth:`Thirty-nine Backpond Street, a three-storey terrace. Fire in the ground-floor front where the mopeds are kept. The caller rents across the road and does not live in the building.`,ifDispatched:`Directed to the casualties by the fire crew on arrival.`,ifIgnored:`Fire crew on scene eleven minutes later.`},f02:{location:`Backpond Street, 39`,lines:[`Our house is on fire. Thirty-nine Backpond Street.`,`I'm on the second floor, I've come down.`,`My wife's out, her mother's out, they're both out the front.`,`The first floor's come out an' all.`,`I don't know about the bottom. The bottom's let out to somebody.`,`I can hear the engine coming.`],truth:`Four people registered at 39, all out of the building. The ground-floor shop unit is empty; there is a further room built on at the back of the house, let separately. The caller does not know its state.`,ifDispatched:`The four from the second floor have no injuries.`,ifIgnored:null},f03:{location:`Backpond Street, 41`,lines:[`There's been a fire down here, Backpond Street.`,`It's alright now, they're all out of it.`,`I can see them sat on the kerb, the family.`,`The brigade's here doing it.`,`I'm only ringing because my husband said to ring.`,`I'm going to shut the window, the smell's coming in.`],truth:`The caller is on the first floor of the next building, watching from her window. What she can see is the four residents of 39. There is also a man sitting at the kerb; he is the first-floor tenant of 39.`,ifDispatched:null,ifIgnored:null},f04:{location:`the back alley behind Newfield Street, 8`,lines:[`There's smoke all down the back here, Newfield Street.`,`I couldn't tell you which house. It's coming over from behind them.`,`There's a place built on across from my back gate, somebody lives in it.`,`I've knocked and nobody's come.`,`He's getting on. He's slow on his feet.`,`I don't know if he's stopping there tonight or not.`],truth:`The alley behind 8 Newfield Street backs onto the rear of 39 Backpond Street. The room built on is let to a sixty-seven year old man. He is inside.`,ifDispatched:`Met the fire crew on scene, door forced.`,ifIgnored:`Carried out by the fire crew once the door was forced.`},t01:{location:`Sugarhouse Road (no number given)`,lines:[`There's a car gone in the ditch down Sugarhouse Road.`,`Past the bend at Charcoal Street, a bit further on than that.`,`The back end's stuck up in the air, lights are still on.`,`There's three or four stood round it and one of them's down in it.`,`I've only rode past, there's cars behind me, I can't stop.`],truth:`A small lorry left the carriageway eastbound on Sugarhouse Road and went into the roadside drainage ditch, nose down. The caller is a motorcyclist who passed and did not stop.`,ifDispatched:`The location is on Sugarhouse Road, beyond the Charcoal Street junction. No lighting on that stretch.`,ifIgnored:null},t02:{location:`Sugarhouse Road, 62`,lines:[`It's outside my house, Sugarhouse Road, sixty-two.`,`A little lorry's gone straight down off the road.`,`We've got him up out of it. Four of us carrying him.`,`His head kept going down on him. I said his name and he answered me.`,`I wasn't going to touch his neck.`,`There's water down there, we couldn't leave him laid in it.`],truth:`The driver is a forty-one year old man with fractures of the fifth and sixth cervical vertebrae. Four people from the street carried him up out of the ditch onto the road.`,ifDispatched:`Neck immobilised, taken in. Paralysed below the fourth cervical vertebra.`,ifIgnored:`Taken in by the people on scene in a private car. Paralysed below the fourth cervical vertebra.`},t03:{location:`Sugarhouse Road, 62 (second line)`,lines:[`I was the one sat next to him, I was in the passenger seat.`,`I'm alright, I got myself out of it.`,`The four of them got him up, I was only stood there watching.`,`I can't get my arm up much, this left one.`,`I want to ring his wife, only I keep going short of breath.`,`I'll sit down a bit and then ring her.`],truth:`The caller is the front-seat passenger from the vehicle, a thirty-six year old man. Fractured left clavicle, ruptured spleen, bleeding into the abdomen. Able to walk.`,ifDispatched:`Intra-abdominal bleeding, spleen removed, survives.`,ifIgnored:`Collapses at the roadside forty minutes later and is found by the people on scene. Dead before hospital.`},t04:{location:`the Charcoal Street junction, facing Sugarhouse Road`,lines:[`You can't get through down Sugarhouse Road.`,`There's a car stopped sideways across it and one down in the ditch under it.`,`I'm meant to be clocking in at five.`,`I've asked them how long and they said it's only the one of them, they're nearly done.`,`There's one of them sat in front of my headlights.`,`I've sounded twice and he's not moved.`],truth:`The man sitting on the carriageway is the passenger from the vehicle. The number of casualties given to the fire brigade by the people on scene was one.`,ifDispatched:null,ifIgnored:null},w01:{location:`Washpit Lane, 8, second floor`,lines:[`It come on about eleven, in my back. Bad with it. I was sick.`,`It's not as bad now as it was.`,`You're alright, I'm not having anybody turn out for this.`,`I went to the toilet and after that it eased off.`,`Thirty-four. I'm thirty-four.`],truth:`Four millimetre stone in the lower right ureter, already passed into the bladder; the colic settled about ten minutes before the call. Blood in the urine on dipstick. No fever, no sign of pyelonephritis. The stone will pass on its own within a few days.`,ifDispatched:`No tenderness over the kidney on arrival, observations normal; he will not get in the vehicle. Written up as a refusal.`,ifIgnored:`He sleeps until midday and two days later sees something the size of a grain of sand in the toilet. He does not go to a doctor.`},w02:{location:`Halloway Street, 15`,lines:[`I can talk quiet, can't I. There's them downstairs.`,`No, don't send anything down, they make a racket coming in this street.`,`It's my leg. The calf's took up and it's still hard now.`,`I can't get up off it right. I've got hold of the wall.`,`Thirty-odd minutes it's been.`],truth:`Sixty year old woman, nocturnal calf cramp. A long day on her feet and a diuretic; potassium low. No swelling, no unilateral warmth, no tenderness along the vein — not a deep vein thrombosis. The knot will let go by itself within an hour or two.`,ifDispatched:`The crew pull her foot back for her in the front room; three minutes later she walks to the door to see them off.`,ifIgnored:`She makes breakfast as usual. The calf aches for two days.`},w03:{location:`Backpond Street, 46`,lines:[`I was holding on to the wall going through and my daughter saw me. She's been on at me to ring ever since.`,`It goes round when I turn over in bed. It goes round the once and then it stops.`,`Same as when I was cleaning my teeth this morning.`,`Six o'clock I've to open up the hall. They'll be stood out there waiting on me. It's not that I won't go.`,`My wife's up now as well. Both of them stood here.`],truth:`Eighty-one year old man, benign paroxysmal positional vertigo of the right posterior semicircular canal. Brought on by turning over and by looking down; each spell of spinning lasts under a minute and it tires out on repeating. An ear, nose and throat clinic can settle it the next day with a repositioning manoeuvre.`,ifDispatched:`The crew lay him down and sit him back up; he says it went round again. Observations normal, nobody travels. He is still telling his daughter about six o'clock while they write up the refusal.`,ifIgnored:`It goes round again when he turns over just after four. He opens the hall at six all the same, holding on to the door frame on his way out. It is over a month before a neighbour takes him to a clinic, and one manoeuvre sorts it.`},w04:{location:`Kestrel Street, 7, first floor`,lines:[`Sorry, before you start — it was me that rang last time as well.`,`That doctor had a go at me over it. Said you don't ring out for this.`,`My hands went numb, all of it, and my mouth, and I couldn't get my breath.`,`If you're busy don't come.`,`It's better now, I've got a bag, a mate showed me.`,`I've not had a drink. I don't drink.`],truth:`Twenty-four year old man, hyperventilation syndrome in an acute anxiety attack. The pins and needles in his hands and round his mouth come from respiratory alkalosis and were already settling during the call. Oxygen saturation normal, no chest pain, no arrhythmia. Second time in three months.`,ifDispatched:`He is sitting in the stairwell by the time they arrive, all readings normal; the crew leave him a leaflet.`,ifIgnored:`He gets to sleep after six, takes a half day, and does not see anyone about it.`},w05:{location:`Sallow Bank, 9`,lines:[`It's these legs of mine. They itch at night. I can't sleep for it.`,`It's not come on today. It's been going a long while.`,`The doctor give me a cream and it's better after it.`,`No, no, don't come out. Don't take any notice of me.`,`The dog I had used to pull at my trouser leg and then I'd leave off scratching.`,`There's a bit of the cream left. The rest of it's in the fridge.`],truth:`Seventy-one year old man, chronic venous stasis dermatitis of both lower legs with night itch. Pigmentation and scratch marks, but no well-demarcated hot red area, no fever, no tenderness — not cellulitis. Lives alone.`,ifDispatched:`The crew are in the house a quarter of an hour and take his blood pressure. He asks if they want a cup of tea before they go.`,ifIgnored:`He scratches until six and then goes and sits out in the yard.`},w06:{location:`Ardley Street, 31`,lines:[`I know this isn't an emergency. I just can't be doing with it any more.`,`It's a tooth. This side, bottom right.`,`Does it cost, having one come out? Then leave it, forget I rang.`,`Three days it's been going. The tablets have done nothing today.`,`My face has puffed up a bit this side. I can still get my mouth open.`],truth:`Forty-five year old woman, pericoronitis of the lower right wisdom tooth with mild buccal swelling. Mouth opening normal, no difficulty swallowing, no swelling in the floor of the mouth, no fever — not Ludwig's angina. Outpatient drainage and antibiotics will do it.`,ifDispatched:`She keeps apologising to the crew and gets in the vehicle in the end; she waits in the department until five for something for the pain.`,ifIgnored:`She sits up until it gets light, goes to a surgery at nine, gets tablets, and is booked for an extraction next week.`},w07:{location:`Ashwell Street, 20, fourth floor`,lines:[`Sorry it's this late. I didn't know who else to ring.`,`My little girl won't stop crying and she keeps pulling at her ear. It's been over an hour.`,`I've took it. Thirty-seven eight.`,`It's probably me.`,`My husband says I'm like this every time.`],truth:`Three year old girl, acute otitis media on the left, drum inflamed but not perforated. Alert, moving normally, no neck stiffness, no rash, no fits. Oral antibiotics from a GP in the morning are enough.`,ifDispatched:`The crew have a look with a torch and tell her to take the child down to the surgery when it opens. Nobody travels.`,ifIgnored:`The child is asleep after four. The mother is not. Tablets at nine; two days later it stops hurting.`},w08:{location:`Mill Road, the metalworks`,lines:[`I've got something in my eye. The right one.`,`I was cutting steel. I hadn't got the goggles on.`,`I'll get it seen to when I finish, sorry to bother you.`,`It's watering all the while. I can't get it open right.`,`I've had it under the tap a long while now.`],truth:`Thirty-six year old man, superficial metallic foreign body on the right cornea with an epithelial abrasion. No penetrating injury (anterior chamber clear, no iris prolapse), the other eye normal, he can still count fingers. Removed by an eye clinic the next day with antibiotic drops; heals, leaving a small rust mark on the cornea.`,ifDispatched:`Eye padded, taken in, the doctor lifts the foreign body out; he gets himself back to the works by half four.`,ifIgnored:`He works with one eye until six, goes to the eye clinic in the morning, and gets a telling off.`},s04r:{location:`Backpond Street, 33`,lines:[],truth:``,ifDispatched:`Died.`,ifIgnored:`Died.`},s04:{location:`Backpond Street, 33`,lines:[`I've got a lump come up, down in the groin.`,`It's always gone back before. It'll not go back tonight.`,`It come up about half nine. I thought I'd sleep on it.`,`I feel a bit sick with it, and I've had nothing to eat.`,`I'm alright sat up. It's when I lie down it blows out.`],truth:`Sixty-nine year old man, right inguinal hernia incarcerated about five hours, the trapped loop of small bowel cut off from its blood supply.`,ifDispatched:`Manual reduction fails, emergency surgery, thirty centimetres of dead small bowel removed, nine days in hospital, survives.`,ifIgnored:null},n12:{location:`Aldgrove Street, 9`,lines:[`I couldn't wake him.`,`His eyes are open and he's gone stiff, I picked him up and he keeps pushing me off.`,`He's six.`,`(off the phone) You were in the kitchen. You didn't see him.`,`He's asleep now. He looks asleep.`],truth:`Six year old boy, night terror, about ninety minutes after falling asleep. It lasted around three minutes and he settled back to sleep on his own.`,ifDispatched:`Fast asleep when the crew arrive; woken, he knows his mother and father. The father insists on going in, and they are kept in the department under observation until it gets light.`,ifIgnored:`Nothing more that night. Seen at a children's clinic in the morning and told it is a night terror.`},q10:{location:`Ardley Street, 18`,lines:[`I've been sick since gone one. Three times.`,`That fried rice at dinnertime, I said it tasted off.`,`It's swollen this side, above the eyebrow.`,`I went to the toilet just now and I walked into the door frame.`,`I've wiped my glasses and they're still smeared.`],truth:`Fifty-nine year old man, acute angle closure glaucoma of the right eye, about three hours in. The field of vision on that side has already narrowed.`,ifDispatched:`The pressure is brought down in the department and a laser iridotomy is done; the right eye comes back to nought point eight.`,ifIgnored:`A neighbour takes him in during the morning, by which time the pressure has been up eleven hours. The outer field of the right eye is lost for good and the central vision is down to nought point two.`},m01:{location:`Clay Pit Road, 140, the mess room on the first floor`,lines:[`I'm on nights here. I've had a bit of a tightness in my chest, before.`,`It's easier now.`,`I sat down and had some water.`,`I'm off at five, I thought I'd get through it.`,`No, no — I rang to ask whether it's worth being seen, that's all.`,`The supervisor's downstairs. I've not said anything to him.`],truth:`Forty-eight year old man, inferior MI. The pain eases when he moves and comes back when he sits.`,ifDispatched:`Cath lab. Survives.`,ifIgnored:`Ventricular fibrillation within thirty minutes.`},m01c:{location:`Clay Pit Road, 140`,lines:[`There's a fella face down in the mess room.`,`I don't know him, I'm off the other line.`,`I've said his name and he's not answered.`,`His phone keeps lighting up on the table.`,`They reckon he swapped shifts today.`,`Where's the supervisor. I'll go and get the supervisor.`],truth:``,ifDispatched:`No pulse on arrival, poor prospects after resuscitation.`,ifIgnored:`Found at the handover.`},m02:{location:`Nithsdale Row, 33, third floor`,lines:[`Hello love, I've come over a bit dizzy.`,`It's when I stand up. Sat down I'm alright.`,`It started this afternoon.`,`My son's at work, he's not back till late.`,`There's only me here.`,`I don't need a vehicle or anything, I only wanted to ask.`,`I'll see what he says when he gets in.`],truth:`Seventy-four year old woman, upper GI bleed, haemoglobin still falling.`,ifDispatched:`Transfused, scoped, survives.`,ifIgnored:`Hypovolaemic shock before morning.`},m02c:{location:`Nithsdale Row, 33, third floor`,lines:[`I've just come in off work.`,`My mum's asleep on the settee and I can't really wake her.`,`She's normally in bed by now, so that's not — she is normally in bed.`,`There's something in the toilet, it's dark, I don't know if she's just not flushed it.`,`She's not said anything to me.`,`She's white, but she's always been white.`,`Shall I let her sleep?`],truth:``,ifDispatched:`Still just about salvageable.`,ifIgnored:`Dead by morning.`},m03:{location:`outside Harmer Road, 88`,lines:[`There's nothing wrong with me, my mate's made me ring.`,`I've gone over in there, in the bar.`,`Back of my head.`,`Yeah, I got up. I got straight up.`,`I'm going to ride home in a bit.`,`No. Honestly, no. You're alright.`,`I feel a bit sick but that's the drink.`,`(hangs up)`],truth:`Thirty-three year old man, fall after drinking, posterior fossa subdural haemorrhage. After he hangs up he walks out and sits down under the parade of shops.`,ifDispatched:`Requires a look round the area. Craniotomy. Survives.`,ifIgnored:`Loses consciousness in about forty minutes.`},m03c:{location:`outside the shop at Harmer Road, 90`,lines:[`There's a bloke sat outside our door.`,`He's been there a while, he was there when I come on.`,`He's not spoken to me.`,`I've asked him if he wants to come in and he just — mmm.`,`He's responsive, he moved.`,`I don't know if he's had a drink or what.`,`This is ninety Harmer Road, not eighty-eight. Eighty-eight's the other one.`],truth:`"He moved" is decerebrate posturing.`,ifDispatched:`Just inside the window.`,ifIgnored:`Dies in the doorway before it's light.`},m04:{location:`Sallow Bank, 21`,lines:[`Hello, is that — `,`Have I got the wrong number?`,`No, I wanted to ask about — `,`(a long pause)`,`It doesn't matter. It's nothing.`,`It's late. Sorry to have bothered you.`,`(hangs up)`],truth:`Seventy-nine year old man, living alone. Black stools since yesterday, breathless since this evening.`,ifDispatched:`Door forced, conveyed, survives.`,ifIgnored:`Dies.`},m05:{location:`Brickfield Row, 7`,lines:[`There's somebody down in a doorway.`,`Brickfield Row, seven.`,`Not mine. Opposite me.`,`He's face down.`,`I'm not turning him over.`,`There's no lights down here, I'm using my phone.`,`Can you be quick.`],truth:`Brickfield Row runs in two separate ends and each end is numbered from one. The man down is at the lower end, number seven. The caller is standing at the upper end, number seven. The two ends are four miles apart with a brook between them. Motorcyclist, come off on his own, haemopneumothorax.`,ifDispatched:`If it goes to the upper end, there is nobody there.`,ifIgnored:`Dies.`},m06:{location:`Fivewells Terrace, 12, second floor`,lines:[`My husband's come down the stairs.`,`From the top landing to the turn, the half-landing.`,`He's with it, he's shouting at me.`,`His leg's swelling up, this bit here.`,`My father-in-law's up on the top, he doesn't need anything, he's asleep.`,`I can't get him up, there's only me.`,`If you do come, the back stairs are easier.`],truth:`The husband has an isolated tibial fracture. He needs a hospital but he is not in danger.`,ifDispatched:`One person conveyed.`,ifIgnored:`The husband gets himself in.`},n01:{location:`Washpit Lane, 30`,lines:[`Is this the right number for this, or is there another one.`,`It's been since about eight.`,`Down. Down there.`,`I've been sick once, about ten o'clock.`,`It's not off anything. I've not done anything to it.`,`My bike's outside but I can't get on it, not the way it is.`,`I'm in at six in the morning.`],truth:`Twenty-two year old man. Testicular torsion, about six hours in. Salvageable inside six hours; after that the tissue dies.`,ifDispatched:`Untwisted in theatre. Kept.`,ifIgnored:`Seen in clinic the next day. Removed.`},n02:{location:`Corve Street, 12, flat 2`,lines:[`He's eleven days old.`,`He's not taken much off me today.`,`I've done his temperature and it says thirty-six. Is thirty-six low. I don't know what it's meant to be.`,`He's been asleep a long while. I've had him up and he won't open his mouth for it.`,`His colour I couldn't tell you. He's my first.`,`My mum says they're all like it at this age.`,`He's in the cot at the side of me.`],truth:`Male infant, eleven days. Early-onset neonatal sepsis. Low temperature and poor feeding are the signs; there is no fever.`,ifDispatched:`Antibiotics, ten days in. Lives.`,ifIgnored:`Apnoea and shock around dawn. Dies after admission.`},n03:{location:`Pinfold Road, outside the petrol station`,lines:[`I've got a fare in the back, she asked for the hospital.`,`She's not saying anything now.`,`I've said to her — she opens her eyes and then they go again.`,`I've pulled in. I'm not driving her about like this.`,`Her bag's on the seat, I've not touched it.`,`Pinfold Road, by the petrol station.`],truth:`Seventy-six year old woman. Complete heart block, ventricular rate around thirty, repeated syncope. She got into the taxi herself.`,ifDispatched:`Temporary pacing. Lives.`,ifIgnored:`Arrests in the car. Dies.`},n04:{location:`Bracken Lane, halfway along`,lines:[`Something's had me. On the arm.`,`A snake. Out the back when I was tipping the water out.`,`I never got a proper look. Short thing.`,`I've put a lace round it, above where it is.`,`It's come up here, this bit.`,`I got done years back and I was alright then.`,`I was going to run myself down but the arm's no good on the wheel.`],truth:`Haemotoxic envenomation. Forearm swelling tracking upwards. Antivenom is at the hospital. The lace is tied above the swelling.`,ifDispatched:`Antivenom. Forearm function preserved.`,ifIgnored:`Coagulopathy with compartment syndrome. Fasciotomy, lasting loss of function.`},n05:{location:`Charcoal Street, the unit at 51`,lines:[`I've had my finger off.`,`The end of it. Second joint.`,`It's stopped bleeding, I've bound it tight.`,`I've got the bit. It's in a cup with ice and water in it.`,`It's not hurting much now, that's the thing.`,`The gaffer says it'll do in the morning.`],truth:`Complete amputation of the right index fingertip at the distal joint. The part is sitting in iced water, which is damaging it. Ischaemic limit around six hours.`,ifDispatched:`Replanted. Partial function returns.`,ifIgnored:`Seen at daybreak, the part is unusable. Stump closed.`},n06:{location:`Heron Road, 22, second floor`,lines:[`I had a section a week last Tuesday.`,`I've gone puffed the last two days, just walking about the flat.`,`I've been to the toilet and then I sat on the edge of the bed getting my breath a long while.`,`It's not a pain. My chest's not hurting.`,`One leg's fatter than the other one. I thought that was just swelling from it.`,`My husband's booked tomorrow off to run me up to the clinic.`,`The baby's asleep in with me.`],truth:`Pulmonary embolism, eight days post-caesarean. The one swollen calf is a deep vein thrombosis.`,ifDispatched:`Anticoagulation, admitted. Lives.`,ifIgnored:`Massive embolism around dawn. Dies.`},n07:{location:`Pinbank Street, 6`,lines:[`There's water coming through my ceiling.`,`I've knocked at the top flat and there's nobody answering.`,`Not the top. The one above me. Sorry.`,`It's the old fella on his own. He's in bed by nine, normally.`,`It's running out under his door onto the landing now.`,`I've rung him and it just goes on and on.`,`There's a bloke does locks at night, I'll get him out.`],truth:`Eighty-two year old man in the flat above. Fallen in the bathroom and cannot get up; the tap is still running. On the floor around two hours.`,ifDispatched:`Door forced. Hypothermia with a fractured hip. Lives.`,ifIgnored:`The locksmith arrives at first light. Severe hypothermia, dies before hospital.`},n08:{location:`Harrow Bank (no location given)`,lines:[`My dad's gone out.`,`He was in at eleven, I know that much.`,`He's got the dementia. He can still work the door.`,`I've been round twice in the car.`,`He's in his pyjamas. His slippers are still at the door.`,`Our lass said ring the police so I've done that.`],truth:`Eighty-three year old man with dementia, missing, barefoot. Nine degrees outside. He is by the drain at the bottom of Harrow Bank.`,ifDispatched:`Found. Moderate hypothermia, rewarmed, lives.`,ifIgnored:`Found by a passer-by after light. Severe hypothermia, dies after admission.`},n09:{location:`Backpond Street, 18`,lines:[`I had a bit of fish Sunday and something's gone down wrong with it.`,`I've swallowed bread at it. Loads of bread.`,`It's swelled up now, this side, my neck.`,`It hurts getting my mouth open.`,`I've got a temperature on me, thirty-eight and a bit.`,`I keep having to spit. I can't keep up with it.`,`I reckon that bone's still down there.`],truth:`Fifty-five year old man. Pharyngeal perforation with deep neck infection, tracking towards the mediastinum. The bone is no longer where he thinks.`,ifDispatched:`Surgical drainage, two weeks in intensive care. Lives.`,ifIgnored:`Mediastinitis and septic shock. Dies.`},n13:{location:`Sugarhouse Road, 60, the care home`,lines:[`This is the home on Sugarhouse Road, I'm reporting a resident.`,`Room A twelve. Male, eighty-seven.`,`Sats are ninety-one.`,`We've got the consent form signed, I can send that over to you.`,`He had a choking episode at teatime, it's written up in the notes.`,`He's as he normally is. He doesn't say a lot anyway.`],truth:`Eighty-seven year old man. Aspiration pneumonia. The ninety-one is on nasal oxygen.`,ifDispatched:`Admitted, antibiotics. Lives.`,ifIgnored:`Respiratory failure at dawn. Dies.`},q01:{location:`Alder Brook Street, 71, the shop`,lines:[`It's the shop on Alder Brook Street.`,`There's a fella sat in the window, he's been there since I come on at eleven.`,`He was eating before. He's not eating now.`,`His head keeps going down, but I said something to him and he did make a noise.`,`The manager doesn't like us ringing you lot.`,`There's a bottle on the table. One of them drinks.`,`There's a coat on the seat next to him, I don't know if that's his or not.`],truth:`Man in his forties, acute alcohol intoxication. Airway clear, responds to voice.`,ifDispatched:`Rousable on arrival, refuses hospital.`,ifIgnored:`Walks out himself after five.`},q02:{location:`Washpit Lane, 8`,lines:[`My husband's been in the toilet a long while.`,`I knocked and he answered me.`,`He's come out and he's sat down out there, he's not gone back to bed.`,`I asked him and he says there's nothing up.`,`He's white. The light's poor in there, I couldn't say for certain.`,`He got up just now and then he sat back down.`],truth:`Sixty-one year old man. Bleeding duodenal ulcer. Haemoglobin around five. Postural hypotension.`,ifDispatched:`Transfused, endoscopic haemostasis. Survives.`,ifIgnored:`Goes to the toilet again about four and collapses. Dead before hospital.`},q04:{location:`Heron Road, 3`,lines:[`I've been bit by my own dog.`,`My leg, here. He never meant it, I stood on him.`,`Two holes. There's not much blood.`,`I've had it under the tap, I had it under a good while.`,`He's had all his jabs.`,`I had a tetanus, but that's ten year back. Longer.`,`My foot's gone a bit numb now.`],truth:`Thirty-five year old man. Two puncture wounds from a domestic dog. No vascular or nerve injury; the numbness is from the cloth he has tied round it.`,ifDispatched:`Loosened, dressed, taken in.`,ifIgnored:`Cleaned and given a tetanus booster at the morning clinic. Red and swollen by day three, settles on oral antibiotics.`},q05:{location:`Blackstone Lane, 26`,lines:[`I've took the wrong tablet.`,`My wife's. Her blood pressure ones.`,`The pots are stood together. I thought it was my stomach one.`,`One. It'll have been one.`,`Gone eleven, that was.`,`Sat here I'm fine. Standing up I go a bit swimmy.`,`I couldn't tell you which sort hers are, it's a long name on the box.`],truth:`Fifty-eight year old man. Single dose of a calcium channel blocker in error. Systolic one hundred and two, no symptomatic rate change.`,ifDispatched:`Four hours' observation, discharged.`,ifIgnored:`Back to normal by morning.`},q06:{location:`Fivewells Terrace, 12`,lines:[`My mate's at mine.`,`She's been crying two hours, she can't stop it.`,`Her hand's shaking, the whole of it.`,`She says her fingers have gone numb and her mouth an' all.`,`She's not had a drink. We've not had anything.`,`I can't ring her mum and dad.`,`She said just now she couldn't see, and then she said she could again.`],truth:`Sixteen year old girl. Prolonged hyperventilation with hypocalcaemic symptoms. Oxygen saturation and consciousness normal.`,ifDispatched:`Settled by the time they arrive. No family present, not conveyed.`,ifIgnored:`Settles in about forty minutes. The two of them fall asleep in the front room.`},q07:{location:`Newfield Street, 39, fourth floor`,lines:[`I had an operation Wednesday, I come home yesterday.`,`My stomach. The womb, they took it.`,`It's gone a bit wet today, the dressing's yellow on it.`,`I've gone cold. I had two quilts on me just now and I was still shaking.`,`I've not done a temperature, ours is broke.`,`The nurse said ring the clinic if there's a problem, only they're shut now.`],truth:`Forty-three year old woman, fourth day after total hysterectomy. Surgical site infection with bacteraemia. The rigor occurred during the bacteraemic episode.`,ifDispatched:`Debridement, drainage, intravenous antibiotics. Twelve days in. Survives.`,ifIgnored:`Septic shock by morning. Intensive care, survives with impaired renal function.`},q08:{location:`Crowmarsh Close, 20`,lines:[`I've gone out with the bin and the door's shut behind me.`,`My little boy's asleep in there, he's three.`,`I've knocked and he's not woke up.`,`I'm stood outside. I've not got my phone, this is next door's.`,`I've had a look through the window, he's laid face down on the settee.`,`The locksmith says forty minutes.`],truth:`Three year old boy, asleep. No fire or gas escape in the property.`,ifDispatched:`Crew waits for the locksmith. Child asleep, not conveyed.`,ifIgnored:`The locksmith gets the door open thirty-five minutes later.`},q09:{location:`Backpond Street, 52`,lines:[`My hand's shaking. The right one, since tonight.`,`I can't get hold of my fork with it.`,`I've not fallen.`,`My son and his wife are stopped upstairs, they've gone to bed.`,`I've an appointment in the morning anyway, nine o'clock.`,`I went to pour a drink just now and it went everywhere.`],truth:`Seventy-four year old man. Cerebellar infarct. Ipsilateral incoordination, no weakness and no speech disturbance.`,ifDispatched:`Admitted. No haemorrhagic transformation. Mild residual ataxia.`,ifIgnored:`Swelling compresses the brainstem before dawn. Decompressive surgery, survives, requires long-term care.`},q11:{location:`Cranmer Street, 14`,lines:[`No — no, there's nobody poorly.`,`I wanted to ask whether you're on all night, that's all.`,`My husband died last month.`,`There's nothing the matter with me.`,`I did my blood pressure just now. A hundred and thirty-eight over eighty-four.`,`I don't know if that's high or not.`,`I went up at eleven. I've just been laid there.`],truth:`Sixty-eight year old woman. No medical complaint. Blood pressure one hundred and thirty-eight over eighty-four. Widowed one month. Lives alone.`,ifDispatched:`Nobody ill or injured. Not conveyed.`,ifIgnored:`She hangs up herself seven minutes into the call.`},r04:{location:`Sallow Bank, 21`,lines:[],truth:``,ifDispatched:`Dies.`,ifIgnored:`Dies.`},r05:{location:`Brickfield Row (upper), 7`,lines:[],truth:``,ifDispatched:`No patient on scene. Brickfield Row (lower), 7 — reported 06:10 by refuse crew.`,ifIgnored:`No patient on scene. Brickfield Row (lower), 7 — reported 06:10 by refuse crew.`},r06:{location:`Fivewells Terrace, 12, second floor`,lines:[],truth:``,ifDispatched:`Same address, third floor, male 88, found by family 05:40, dead on arrival.`,ifIgnored:`Same address, third floor, male 88, found by family 05:40, dead on arrival.`},s01:{location:`Alder Brook Street, 21, second floor`,lines:[`The second floor's been banging since gone twelve.`,`It's not music. It's something hard. Slow with it — bang, and then bang.`,`I've been down and rung his bell and he's not answered.`,`My husband says he'll be putting shelves up.`,`I'm out the door at six.`],truth:`Seventy-nine year old man on the second floor. Fallen in the bathroom, fractured neck of femur, cannot get up. The tap is still running. The banging is him.`,ifDispatched:`Door forced. Fractured hip, operated on, survives.`,ifIgnored:`Water is down to the first-floor landing by half six and the door gets forced. Hypothermia, dies before hospital.`},s01c:{location:`Alder Brook Street, 21, first floor`,lines:[`I don't know if this is you or the water lot.`,`There's water coming through my ceiling out on the landing.`,`It's not pouring in, it's just dripping, all the time.`,`I've stood a washing-up bowl under it and it's wanting emptying already.`,`The number on the board out the front just rings and rings.`,`I've been up and knocked and there's nobody come to the door.`,`The paper's come away and there's a bag of it hanging down now.`],truth:`The leak is from a tap left running in the bathroom on the second floor.`,ifDispatched:`One vehicle out.`,ifIgnored:`The leak carries on into the morning.`},s02:{location:`Sugarhouse Road, 58`,lines:[`Hang on. Hang on a minute.`,`It's my stomach.`,`It started this afternoon. I thought it was something I'd eaten.`,`When it comes I can't move with it. It's easier now than it was.`,`I'm on my own in the shop.`,`I'll get the shutter down in a bit.`],truth:`Fifty-six year old man. Acute appendicitis, already with peritoneal signs.`,ifDispatched:`Operated on. Survives.`,ifIgnored:`Perforates. Peritonitis.`},s02c:{location:`Sugarhouse Road, 58`,lines:[`That was me before, about half one. The stomach.`,`No, you're alright. It's gone off.`,`It went all at once, about ten minutes back.`,`I've been out the front and put the lights off.`,`I'll get something off the chemist when they open.`,`I'm going up in a minute.`],truth:`The appendix has perforated. The pain stopped at the moment it burst.`,ifDispatched:`Surgery, peritonitis, eleven days in intensive care. Survives.`,ifIgnored:`Found by family upstairs in the morning. Dies.`},s03:{location:`Ashwell Street, 12, first floor`,lines:[`My husband's in the front room going through everything.`,`He says he's looking for his wallet. It's in his hand.`,`He's wringing wet. Cold with it.`,`He's not had a drink. He doesn't drink.`,`I've told him to sit down and he's gone off at me.`,`I put the telly off and he's put it back on.`],truth:`Sixty-eight year old man on a sulphonylurea for his diabetes, ate very little at tea. Blood glucose two point one.`,ifDispatched:`Intravenous glucose on scene, comes round, the family sign a refusal.`,ifIgnored:`Loses consciousness within two hours.`},s03c:{location:`Ashwell Street, 12, first floor`,lines:[`He's gone like it again.`,`That chap said to give him something to eat, so I've give him two sugar lumps.`,`He had them. He's been laid down since.`,`If I say his name now he makes a noise.`,`I'll give him another one.`],truth:`Hypoglycaemia from a su
