:[`他今天下午出院。`,`就那個心跳快的，你們有來過。`,`他說他又來了。`,`這次沒有很喘。`,`他自己說沒關係，叫我不要打。`,`我還是想問一下。`,`他坐在車上。`],truth:`轉復後出現心律不整，此刻為無症狀性心室頻脈。`,ifDispatched:`住院觀察，存活。`,ifIgnored:`四十分鐘後猝死。`,axes:[5,6],soundsSevere:!1,reallySevere:!0},{id:`c53`,sourceClock:`03:58`,atMin:298,location:`雲和坡 14 號`,windowMin:30,lines:[`我不是要救護車，我先講。`,`我聞到瓦斯，一點點而已。`,`我起來上廁所聞到的。`,`窗戶我開了，可是開了會冷。`,`我兒子有裝一個會叫的，它沒有叫。`,`總開關我找不到，以前都是我太太在用的。`,`我還是把窗戶關起來好了，你說呢。`],truth:`確有微量洩漏，濃度低，通風後無危險。通報者八十歲、獨居，無法自行關閉總開關。`,ifDispatched:`協助關閉，無傷病送醫。`,ifIgnored:`無醫療事件。`,axes:[6],soundsSevere:!1,reallySevere:!1},{id:`c54`,sourceClock:`04:12`,atMin:null,location:`大溪橋下工地`,windowMin:30,lines:[`我要投訴。`,`你們早上來過這裡。`,`我朋友被你們載走，現在我聯絡不到。`,`他家人一直打給我。`,`我不知道要跟誰講。`,`我很生氣。`,`我沒有要救護車。`],truth:`無醫療事件。通報者語言不流利、找不到查詢管道。`,ifDispatched:`空跑。`,ifIgnored:`無事。`,axes:[4],soundsSevere:!0,reallySevere:!1},{id:`c55`,sourceClock:`04:26`,atMin:326,location:`寧德巷 8 號`,windowMin:30,lines:[`我媽剛剛一直說要回家。`,`她就在家裡啊。`,`她說要去接我爸，我爸走五年了。`,`她今天下午開始這樣。`,`她說腰痠。`,`沒有跌倒，沒有發燒。`,`是不是又發作了。`],truth:`泌尿道感染引發老年譫妄併敗血症前期。「又發作了」指的是失智，家屬歸因錯誤。`,ifDispatched:`抗生素，存活。`,ifIgnored:`清晨敗血性休克。送醫後死亡。`,axes:[5],soundsSevere:!1,reallySevere:!0},{id:`c56`,sourceClock:`04:41`,atMin:341,location:`五福里 30 號`,windowMin:30,lines:[`我要你們立刻過來，現在，馬上。`,`我媽在裡面。`,`她不出來。`,`她說她不要去醫院，可是她一定要去。`,`你們可以強制帶走對不對。`,`我已經打第三次了。`],truth:`八十歲女性，末期病人，在家、清醒、拒絕就醫，決定明確。兒子無法接受。`,ifDispatched:`無法違反本人意願，現場僵持一小時。`,ifIgnored:`無變化。`,axes:[4],soundsSevere:!0,reallySevere:!1},{id:`c57`,sourceClock:`05:23`,atMin:null,location:`舊窯里 61 號前`,windowMin:30,lines:[`先生你好。`,`我想問一下，剛剛那邊。`,`路已經清了。`,`我只是想知道……那個一直叫的。`,`他後來有出來嗎。`,`沒事，我只是問。`,`不好意思這麼早。`,`你們辛苦了。`],truth:`無新事件，無人受傷。`,ifDispatched:`無可派之處。`,ifIgnored:`無事。`,axes:[4],soundsSevere:!1,reallySevere:!1}],v=[{id:`c58`,sourceClock:`23:47`,atMin:47,location:`柏溪街 6 號 1 樓`,windowMin:20,lines:[`阿嬤那個……那個管子。`,`脖子。這裡。`,`我不會講。對不起。`,`我推回去，推不進去。`,`她有呼吸，有，很小。`,`她臉現在……不一樣。`,`我一個人。我先生……不是，是她兒子，沒有回來。`,`我怎麼辦。`],truth:`八十四歲女性氣切管完全脫出約十分鐘，造口正在收縮，通氣不足。看護到職三週，不知道那個東西叫什麼。`,ifDispatched:`重新置管，送醫，存活。`,ifIgnored:`造口閉合，缺氧至心跳停止。`,axes:[1,3],soundsSevere:!1,reallySevere:!0},{id:`c59`,sourceClock:`00:12`,atMin:72,location:`洗石巷 21 號`,windowMin:25,lines:[`我、我、我家……我家有味、味道。`,`不是。不是那個。`,`等一下。`,`瓦、瓦、瓦——`,`（吸氣）我聞到很久了。`,`我、我要開燈嗎。`,`洗、洗石巷。二、二十——`,`你、你等我一下，我講不出來。`],truth:`桶裝瓦斯軟管接頭鬆脫，密閉套房內累積約四十分鐘。通報者口吃，越急越卡；他已有頭痛與噁心。`,ifDispatched:`斷氣源、通風，無人受傷。`,ifIgnored:`他開了燈；氣爆，重度燒傷。`,axes:[1],soundsSevere:!1,reallySevere:!0},{id:`c60`,sourceClock:`00:38`,atMin:98,location:`糖廍路 14 號 5 樓`,windowMin:25,lines:[`我兒子有事，可是我看不懂他在比什麼。`,`他聽不到，他從小就聽不到。`,`他一直指肚子，然後又指嘴巴。`,`他手在抖。我以為他在生氣。`,`他呼吸很大力，很大力，一直吸。`,`我學得不好，我只看得懂一點。`,`他早上就沒吃東西了。`],truth:`十六歲男性第一型糖尿病酮酸中毒，深快呼吸；父親手語有限，把口渴與腹痛看成情緒。`,ifDispatched:`輸液與胰島素，住院五天。`,ifIgnored:`清晨昏迷，腦水腫。送醫後存活，認知受損。`,axes:[3,7],soundsSevere:!1,reallySevere:!0},{id:`c61`,sourceClock:`01:05`,atMin:125,location:`後埤街 33 號`,windowMin:30,lines:[`我想問一下我這樣有沒有關係。`,`我這兩天感冒，一直吃藥。`,`就電視上那個藍色的啊，那個一包一包的。`,`還有一個白色罐子的，我媳婦買的。`,`有啊，我兩種都有吃，不然沒效。`,`吃幾包喔……我沒有算。`,`我現在其實還好，就是不太想吃東西。`],truth:`七十一歲男性，兩種複方感冒藥皆含同一成分，三日累積過量，肝損傷已開始，症狀要到二十四小時後才顯現。`,ifDispatched:`早期給予解毒劑，痊癒。`,ifIgnored:`兩天後猛爆性肝衰竭。死亡。`,axes:[3,5],soundsSevere:!1,reallySevere:!0},{id:`c62`,sourceClock:`01:31`,atMin:151,location:`松岡二街 9 號`,windowMin:30,lines:[`（口音濃重）我跋倒兩工矣。`,`啊？`,`我講我跋倒。地上。`,`無人啦，我一个。`,`腳袂振動。`,`（聽不清）……袂放……`,`什麼？大聲一點。`,`無要緊啦，我等天光。`],truth:`七十九歲男性跌倒後臥地約五十小時，橫紋肌溶解合併急性腎衰竭與高血鉀。他重複的那半句是「解不出尿」。`,ifDispatched:`緊急透析，存活，腎功能部分恢復。`,ifIgnored:`日出前心律不整死亡。`,axes:[3,6],soundsSevere:!1,reallySevere:!0},{id:`c63`,sourceClock:`01:58`,atMin:178,location:`六和坡 彎道下`,windowMin:25,lines:[`這裡有人躺在路邊。`,`我剛好經過。`,`沒有，我沒喝。今天沒有。`,`他躺在……草那邊。旁邊。`,`我車停在前面一點。`,`不是我啦，我跟你講不是我。`,`我在這裡等。`,`你們從上面下來比較快。`],truth:`通報者酒後駕駛擦撞行人，人被撞入邊坡草叢下方約三公尺。行人骨盆與胸部外傷，通報者自己有前胸鈍傷。`,ifDispatched:`現場需搜索，兩人皆送醫，行人存活。`,ifIgnored:`行人在草叢中失溫並持續內出血，天亮前死亡。`,axes:[8,2],soundsSevere:!1,reallySevere:!0},{id:`c64`,sourceClock:`02:24`,atMin:204,location:`翠亨路 8 巷 2 號`,windowMin:25,lines:[`我媳婦跌倒了。`,`客廳，她自己絆到。`,`有點瘀青，肚子這邊。`,`我兒子在旁邊啊，他很緊張。`,`她坐著，她好好的，她剛剛還講話。`,`不用啦，你們來看一下就好，不要叫別人來。`,`（背景：男聲，聽不清）`],truth:`脾臟破裂，腹腔內出血持續中。施暴者是通報者的兒子；通報者在現場，選擇改述。`,ifDispatched:`手術，存活；現場啟動保護通報。`,ifIgnored:`三小時內失血性休克死亡。`,axes:[8,6],soundsSevere:!1,reallySevere:!0},{id:`c65`,sourceClock:`02:51`,atMin:231,location:`烏石巷 4 號`,windowMin:30,lines:[`小姐我想問一下，人一直冒汗是怎樣。`,`沒有啦，我沒有怎樣。`,`就有點想吐，然後手麻麻的。`,`我一個人在家。`,`我沒有吃什麼。`,`藥？沒有啊。`,`你可以叫他們順便過來嗎，不用趕。`,`我先掛了喔，我有點想睡。`],truth:`三十歲女性一次吞下整排處方鎮靜劑約四十分鐘前，隨即後悔而撥號，但不打算承認。`,ifDispatched:`洗胃與監測，存活，轉介後續。`,ifIgnored:`清晨呼吸抑制死亡。`,axes:[4],soundsSevere:!1,reallySevere:!0},{id:`c66`,sourceClock:`03:26`,atMin:266,location:`新豐街 12 號後面`,windowMin:30,lines:[`我手臂割到了。`,`我在弄鐵皮，那個邊很利。`,`（停）沒有很深啦。`,`有壓著，毛巾。`,`一直在滲。`,`這個……你們來的話會不會通報什麼。`,`我沒有要怎樣，你不要想太多。`,`不然我自己去好了，你當我沒打。`],truth:`前臂多道自傷創口，其中一道深及血管，持續出血；他在通話中越講越想掛斷。`,ifDispatched:`止血縫合，送醫並轉介。`,ifIgnored:`失血與意識喪失，天亮被發現。送醫後存活。`,axes:[4,8],soundsSevere:!1,reallySevere:!0},{id:`c67`,sourceClock:`04:03`,atMin:303,location:`風車路 倉庫後門`,windowMin:20,lines:[`快來啊——他的腳卡在裡面——`,`機器停了，停了！可是拉不出來——`,`他有講話！他還在講話！他叫我不要拉——`,`多久？我不知道，我進來就這樣了——`,`他說他不痛了——`,`你們快一點，快一點——他一直說他要睡——`],truth:`攪拌機停機後小腿受困約兩小時，擠壓症候群。解除壓迫瞬間高血鉀將導致心律不整。「不痛了」是神經與組織壞死。`,ifDispatched:`解除前輸液與矯正，截肢，存活。`,ifIgnored:`現場人員自行拉出，患者當場心跳停止。`,axes:[2],soundsSevere:!0,reallySevere:!0}],y=[{id:`m01`,sourceClock:`01:52`,atMin:172,location:`清水路 140 號 倉庫二樓休息室`,windowMin:25,lines:[`我上大夜的，剛剛胸口悶了一下。`,`現在好一點了。`,`我有坐下來喝水。`,`五點下班，我想說撐一下就好。`,`不用啦，我打來是想問這樣要不要看。`,`主任在樓下，我沒跟他講。`],truth:`48 歲男性，下壁心肌梗塞，症狀在移動時緩解、休息時再發。`,ifDispatched:`心導管，存活。`,ifIgnored:`三十分鐘內心室顫動。死亡。`,axes:[5,6],soundsSevere:!1,reallySevere:!0,followUps:[{childId:`m01c`,trigger:`notDispatched`,delayMin:37,form:`proxyCaller`},{childId:`m01c`,trigger:`delayedOver`,delayMin:37,form:`proxyCaller`,overMin:25}]},{id:`m01c`,sourceClock:`02:29`,atMin:null,location:`清水路 140 號`,windowMin:25,lines:[`休息室有一個人趴著。`,`我不認識他，我是隔壁線的。`,`我叫他他沒有應。`,`他手機在桌上一直亮。`,`他們說他今天有換班。`,`主任呢，我去叫主任。`],truth:``,ifDispatched:`到場已無脈搏，急救後恢復自發循環機率低。急救無效，死亡。`,ifIgnored:`天亮交班時被發現。死亡。`,axes:[2],soundsSevere:!1,reallySevere:!0},{id:`m02`,sourceClock:`00:44`,atMin:104,location:`寧德巷 33 號 4 樓`,windowMin:30,lines:[`小姐我頭有點暈。`,`站起來的 :!1,batch:`C`},{id:`q05`,sourceClock:`23:09`,atMin:9,location:`烏石巷 26 號`,windowMin:25,lines:[`我剛剛吃錯藥。`,`我太太的，她那個降血壓的。`,`我以為是我的胃藥，罐子放一起。`,`一顆。應該是一顆。`,`十一點多吃的。`,`我現在坐著沒事，站起來有一點飄。`,`她的藥我不知道是哪一種，我看盒子上面是英文。`],truth:`五十八歲男性，誤服單顆鈣離子阻斷劑。收縮壓一〇二，無症狀性心搏變化。`,ifDispatched:`到院觀察四小時後離院。`,ifIgnored:`清晨血壓回復。`,axes:[],soundsSevere:!1,reallySevere:!1,batch:`C`},{id:`q06`,sourceClock:`23:26`,atMin:26,location:`五福里 12 號`,windowMin:25,lines:[`我朋友在我家。`,`她一直哭，兩個小時了，停不下來。`,`她手在抖，整隻手。`,`她說她手指麻，嘴巴也麻。`,`她沒有喝酒，我們什麼都沒有。`,`她爸媽我不能打。`,`她剛剛說她看不到，然後又說看得到了。`],truth:`十六歲女性，長時間過度換氣併低血鈣症狀。血氧與意識正常。`,ifDispatched:`到場已緩解，家屬未到場，未送醫。`,ifIgnored:`約四十分鐘後緩解，兩人於客廳睡著。`,axes:[],soundsSevere:!0,reallySevere:!1,batch:`C`},{id:`q07`,sourceClock:`23:43`,atMin:43,location:`新豐街 39 號 5 樓`,windowMin:25,lines:[`我禮拜三開刀，昨天出院。`,`肚子。子宮那個。`,`傷口今天有一點濕濕的，紗布黃黃的。`,`我有一點發冷，剛剛蓋兩件被子還在抖。`,`我沒有量體溫，家裡那支壞了。`,`護理師說有問題打回去診所，可是現在沒開。`,`出院那天他們有給我一張紙，我找不到。`],truth:`四十三歲女性，子宮全切除術後第四日，手術部位感染併菌血症。畏寒顫抖發生於菌血症期間。`,ifDispatched:`清創引流與靜脈抗生素，住院十二日，存活。`,ifIgnored:`清晨敗血性休克。加護病房，存活，腎功能受損。`,axes:[],soundsSevere:!1,reallySevere:!0,batch:`C`},{id:`q08`,sourceClock:`00:00`,atMin:60,location:`河堤三巷 20 號`,windowMin:30,lines:[`我出去倒垃圾，門關起來了。`,`我小孩在裡面睡覺，三歲。`,`我有敲，他沒有醒。`,`我在門口，我沒有手機——這是鄰居的。`,`我剛剛從窗戶看，他趴著在沙發上。`,`鎖匠說要四十分鐘。`],truth:`三歲男童，睡眠中。屋內無明火與瓦斯外洩。`,ifDispatched:`到場等候鎖匠開門，兒童睡眠中，未送醫。`,ifIgnored:`鎖匠三十五分鐘後到場開門。`,axes:[],soundsSevere:!1,reallySevere:!1,batch:`C`},{id:`q09`,sourceClock:`00:17`,atMin:77,location:`後埤街 52 號`,windowMin:30,lines:[`我手抖，右手，從晚上開始。`,`拿筷子夾不起來。`,`我沒有跌倒。`,`我兒子跟媳婦在樓上睡了。`,`我明天有掛號，早上九點的。`,`剛剛我倒水灑出來。`],truth:`七十四歲男性，小腦半球梗塞。同側肢體協調不良，無肢體無力與言語障礙。`,ifDispatched:`住院，無出血轉化，遺留輕度共濟失調。`,ifIgnored:`清晨梗塞腫脹壓迫腦幹。開顱減壓，存活，需長期照護。`,axes:[],soundsSevere:!1,reallySevere:!0,batch:`C`},{id:`q10`,sourceClock:`02:41`,atMin:221,location:`麻園街 18 號`,windowMin:30,lines:[`我從一點多吐到現在，三次。`,`中午那個炒飯我就覺得味道怪。`,`右邊這裡脹，眉毛上面。`,`剛剛去廁所我撞到門框。`,`眼鏡我擦過了，還是糊的。`],truth:`五十九歲男性，右眼急性閉鎖隅角青光眼，發作約三小時。右側視野已縮窄。`,ifDispatched:`急診降眼壓後雷射虹膜造孔，右眼視力〇點八。`,ifIgnored:`上午由鄰居送醫時眼壓已持續十一小時，右眼周邊視野永久喪失，中心視力〇點二。`,axes:[5],soundsSevere:!1,reallySevere:!0},{id:`q11`,sourceClock:`00:34`,atMin:94,location:`光復北巷 14 號`,windowMin:30,lines:[`沒有，沒有人不舒服。`,`我想問一下你們是不是二十四小時。`,`我先生上個月走了。`,`我沒有什麼事。`,`我剛剛量血壓，一百三十八，八十四。`,`我不知道這樣算不算高。`,`我十一點就上床了，躺著。`],truth:`六十八歲女性，無醫療主訴。血壓一三八／八四。配偶於一個月前死亡。獨居。`,ifDispatched:`到場無傷病，未送醫。`,ifIgnored:`通話七分鐘後由她自己掛斷。`,axes:[],soundsSevere:!1,reallySevere:!1,batch:`C`}],S=[{id:`f01`,sourceClock:`02:31`,atMin:153,location:`後埤街（門牌不明）`,windowMin:25,groupId:`fire-houbei`,lines:[`後埤街這邊有一間在燒。`,`我剛回來就這樣了。`,`幾號我看不到，招牌擋住。`,`一樓那裡，鐵門那邊。`,`消防我也打了。`,`煙很多，都往上。`,`我車停在下面，我先去移。`],truth:`後埤街 39 號三層透天，一樓機車停放處起火。通報者為對街租屋者，非住戶。`,ifDispatched:`到場後由消防指引至傷者。`,ifIgnored:`消防於十一分鐘後到場。`,axes:[7],soundsSevere:!0,reallySevere:!0},{id:`f02`,sourceClock:`02:32`,atMin:156,location:`後埤街 39 號`,windowMin:25,groupId:`fire-houbei`,lines:[`我們這棟在燒。後埤街三十九號。`,`我住三樓，我下來了。`,`我太太在，我岳母在，都在外面。`,`二樓的也出來了。`,`一樓我不知道有沒有人，一樓是租給人家的。`,`消防車我聽到了。`],truth:`39 號登記住戶四人，全部在屋外。一樓臨街店面空置，屋後另有加蓋房間出租，通報者不清楚該房間狀況。`,ifDispatched:`到場後三樓一家四人均無外傷。`,ifIgnored:null,axes:[4],soundsSevere:!0,reallySevere:!0},{id:`f03`,sourceClock:`02:33`,atMin:159,location:`後埤街 41 號`,windowMin:25,groupId:`fire-houbei`,lines:[`後埤街這邊剛剛有火。`,`已經沒事了，人都在外面。`,`我看到他們一家坐在路邊。`,`消防在弄了。`,`我打是因為我先生叫我打。`,`我要去把窗戶關起來，味道進來了。`],truth:`通報者住隔壁棟二樓，自窗口觀看。她看到的是 39 號住戶四人。路邊另有一名男性坐著，為 39 號二樓住戶。`,ifDispatched:null,ifIgnored:null,axes:[5],soundsSevere:!1,reallySevere:!0},{id:`f04`,sourceClock:`02:34`,atMin:162,location:`新豐街 8 號後巷`,windowMin:25,groupId:`fire-houbei`,lines:[`新豐街這邊巷子裡都是煙。`,`我不知道是哪一間，煙是從後面過來的。`,`我後門對面有一間加蓋的，平常有人住。`,`我剛剛敲了沒有人應。`,`他年紀滿大的，走路很慢。`,`我不知道他今天在不在。`],truth:`新豐街 8 號後巷與後埤街 39 號屋後相連。加蓋房間承租人為六十七歲男性，在屋內。`,ifDispatched:`到場後與消防會合，破門。`,ifIgnored:`消防於破門後將其抬出。`,axes:[6],soundsSevere:!1,reallySevere:!0}],C=[{id:`t01`,sourceClock:`02:30`,atMin:150,location:`糖廍路（門牌不明）`,windowMin:25,groupId:`ditch-tangbu`,lines:[`糖廍路那邊有一台車掉到溝裡。`,`過了炭窯街那個彎再一點點。`,`車屁股翹在上面，燈還亮著。`,`旁邊有三四個人，有一個在下面。`,`我騎過去而已，後面有車我沒辦法停。`],truth:`小貨車自糖廍路東向駛離路面，翻落路旁排水溝，車頭朝下。通報者為經過之機車騎士，未停車。`,ifDispatched:`到場位置在糖廍路與炭窯街之間，路面無照明。`,ifIgnored:null,axes:[7],soundsSevere:!0,reallySevere:!0},{id:`t02`,sourceClock:`02:31`,atMin:153,location:`糖廍路 62 號前`,windowMin:25,groupId:`ditch-tangbu`,lines:[`我家門口這邊，糖廍路六十二號。`,`一台小貨車衝下去了。`,`我們把人弄上來了，四個人抬的。`,`他的頭一直垂，我叫他他有應。`,`他脖子我本來不敢動。`,`下面是水，不弄上來不行。`],truth:`駕駛為四十一歲男性，第五、六頸椎骨折。現場民眾四人自溝中將其抬上路面。`,ifDispatched:`頸椎固定，送醫。第四頸椎以下癱瘓。`,ifIgnored:`由現場民眾以自小客車送醫。第四頸椎以下癱瘓。`,axes:[4],soundsSevere:!0,reallySevere:!0},{id:`t03`,sourceClock:`02:33`,atMin:156,location:`糖廍路 62 號前（另一線）`,windowMin:25,groupId:`ditch-tangbu`,lines:[`我是坐旁邊那個，我坐副駕。`,`我沒事，我自己爬出來的。`,`他們四個把他抬上來，我在旁邊看而已。`,`我手舉不太起來，左邊這隻。`,`我要打給他老婆，可是我講話會喘。`,`我坐一下再打。`],truth:`通報者為該車副駕駛座乘客，三十六歲男性。左鎖骨骨折，脾臟破裂，腹腔內出血中。可自行行走。`,ifDispatched:`腹腔內出血，脾切除，存活。`,ifIgnored:`四十分鐘後於路邊倒地，由現場民眾發現。到院前死亡。`,axes:[5,6],soundsSevere:!1,reallySevere:!0},{id:`t04`,sourceClock:`02:36`,atMin:159,location:`炭窯街口（糖廍路方向）`,windowMin:25,groupId:`ditch-tangbu`,lines:[`糖廍路這邊過不去。`,`有一台車橫在中間，下面那台掉到溝裡。`,`我五點要打卡。`,`我問他們還要多久，他們說一個人而已，快好了。`,`有一個坐在我車燈前面。`,`我按了兩次，他沒有動。`],truth:`坐於路面之男性為該車乘客。現場民眾向消防通報之傷者人數為一人。`,ifDispatched:null,ifIgnored:null,axes:[6],soundsSevere:!1,reallySevere:!0}],w=[{id:`w01`,sourceClock:`01:20`,atMin:140,location:`洗石巷 8 號 3 樓`,windowMin:30,lines:[`我十一點多開始腰痛，很痛，痛到吐。`,`現在……現在好像沒有那麼痛了。`,`對，剛剛我上廁所，之後就比較鬆。`,`不會啦，不用麻煩你們。`,`三十四。三十四歲。`],truth:`右側輸尿管下段結石約 4 mm，已排入膀胱，絞痛在通話前約十分鐘緩解。尿液潛血陽性。石頭會在數日內自行排出。`,ifDispatched:`到場時腰部無敲擊痛、生命徵象正常，他堅持不上車；救護紀錄寫「拒送」。`,ifIgnored:`他睡到中午，隔兩天在馬桶裡看到一顆沙子大的東西，沒有去看醫生。`,axes:[5,6],soundsSevere:!1,reallySevere:!1},{id:`w02`,sourceClock:`02:40`,atMin:220,location:`寧德巷 15 號`,windowMin:25,lines:[`小聲一點沒關係吧，我怕吵到樓下。`,`我小腿抽起來，抽到現在還硬硬的。`,`站不太起來，我扶著牆。`,`三十幾分鐘了吧。`,`不用不用，車子進來這個巷子很吵。`],truth:`六十歲女性夜間腓腸肌痙攣。日間久走加上服用利尿劑，血鉀偏低。肌肉硬結會在一兩小時內自行鬆開。`,ifDispatched:`救護員在客廳幫她把腳掌扳回來，三分鐘後她自己站起來走到門口送人。`,ifIgnored:`天亮她照常煮早餐，小腿痠了兩天。`,axes:[6],soundsSevere:!1,reallySevere:!1},{id:`w03`,sourceClock:`01:35`,atMin:155,location:`後埤街 46 號`,windowMin:30,lines:[`我扶著牆走，被我女兒看到，她就一直說要打。`,`我翻身的時候會轉，轉一下就停了。`,`早上刷牙那次也是這樣。`,`六點我要去廟裡，人家都排好了，我不是不去。`,`我太太也起來了，兩個都站在這裡。`],truth:`八十一歲男性，右耳後半規管良性陣發性姿位性眩暈（耳石症）。翻身與低頭誘發，每次旋轉感持續不到一分鐘，反覆發作有疲勞現象。次日耳鼻喉科做耳石復位即可解決。`,ifDispatched:`救護員讓他躺下再坐起來，他說又轉了一下，數值正常，沒有上車。填拒送單的時候他一直在跟女兒說六點要出門。`,ifIgnored:`他四點多翻身又轉了一次，六點還是去了廟裡，出門扶著門框。拖了一個多月才被鄰居帶去耳鼻喉科，復位一次就好了。`,axes:[5,6],soundsSevere:!1,reallySevere:!1},{id:`w04`,sourceClock:`04:20`,atMin:320,location:`南興二街 4 巷 7 號 2 樓`,windowMin:25,lines:[`先跟你說對不起，上次也是我打的。`,`上次那個醫生講我，說這種不用叫車。`,`我剛剛手整個麻，嘴巴也麻，喘不過來。`,`你們如果很忙就不用來。`,`現在有比較好了，我有拿袋子，我朋友教我的。`,`我沒有喝酒，我不喝的。`],truth:`二十四歲男性過度換氣症候群，急性焦慮發作。手足及口周感覺異常來自呼吸性鹼中毒，通話中已在緩解。三個月內第二次。`,ifDispatched:`到場時他已經坐在樓梯間，數值全部正常，救護員留了衛教單。`,ifIgnored:`他六點多才睡著，早上請了半天假，沒有去看身心科。`,axes:[4,6],soundsSevere:!1,reallySevere:!1},{id:`w05`,sourceClock:`05:10`,atMin:370,location:`雲和坡 9 號`,windowMin:30,lines:[`我這個腳，晚上會癢，癢到睡不著。`,`不是今天才這樣，很久了。`,`醫生開的那個藥膏擦完好一點。`,`沒有沒有，不用來，你不要當真。`,`我以前那隻狗會來咬我的褲管，我就不會一直抓。`,`藥膏還有一點，剩下的在冰箱。`],truth:`七十一歲男性，雙側小腿慢性靜脈鬱積性皮膚炎併夜間搔癢。皮膚色素沉著、有抓痕。獨居。`,ifDispatched:`救護員在他家待了十幾分鐘，量了血壓，離開前他問要不要泡茶。`,ifIgnored:`他抓到六點，天亮了就去院子裡坐著。`,axes:[6,4],soundsSevere:!1,reallySevere:!1},{id:`w06`,sourceClock:`00:55`,atMin:115,location:`麻園街 31 號`,windowMin:25,lines:[`我知道這個不算急診，可是我真的受不了。`,`牙齒，這邊，右邊下面。`,`痛了三天，止痛藥吃到今天沒有效。`,`臉有腫一點，可是嘴巴還張得開。`,`叫車要錢嗎？那算了，我明天去看牙醫，你當我沒打。`],truth:`四十五歲女性右下第三大臼齒冠周炎，輕度頰側腫脹，開口度正常。門診切開引流加抗生素即可。`,ifDispatched:`救護員到的時候她一直說不好意思，最後上了車，在急診等到五點拿到止痛藥。`,ifIgnored:`她坐到天亮，九點去診所，牙醫幫她開了藥，下週拔。`,axes:[6],soundsSevere:!1,reallySevere:!1},{id:`w07`,sourceClock:`02:05`,atMin:185,location:`明水二街 20 號 5 樓`,windowMin:25,lines:[`不好意思這麼晚，我不知道要打哪裡。`,`我女兒一直哭，一直抓耳朵，哭一個多小時了。`,`有量，三十七度八。`,`應該還好對不對，我可能太緊張。`,`我先生說我每次都這樣。`],truth:`三歲女童急性中耳炎（左），鼓膜充血未穿孔。意識清楚，活動力正常。天亮小兒科口服抗生素即可。`,ifDispatched:`救護員用手電筒看了看，說天亮再帶去診所就好，沒有上車。`,ifIgnored:`小孩四點多睡著。母親沒有睡。九點門診拿了藥，兩天後不痛了。`,axes:[4,5],soundsSevere:!1,reallySevere:!1},{id:`w08`,sourceClock:`03:45`,atMin:285,location:`風車路 鐵工廠`,windowMin:30,lines:[`我眼睛跑進東西，右邊。`,`切鐵的時候，那個護目鏡我沒戴。`,`一直流眼淚，張不太開。`,`我有沖水，沖很久了。`,`我等下班再去看就好，不好意思打擾。`],truth:`三十六歲男性右眼角膜表淺金屬異物併上皮擦傷，無穿透傷。次日眼科取出加抗生素眼藥水即痊癒，會留一小點角膜鏽斑。`,ifDispatched:`救護員蓋了眼罩帶他去，急診醫師取出異物，他四點半自己搭車回工廠。`,ifI
